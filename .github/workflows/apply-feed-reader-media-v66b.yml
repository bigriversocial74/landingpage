name: Apply Feed Reader Media v66B

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-feed-reader-media-v66b.py
      - .github/workflows/apply-feed-reader-media-v66b.yml

permissions:
  contents: write

concurrency:
  group: feed-reader-media-v66b
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/feed-reader-media-v66b-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 tools/apply-feed-reader-media-v66b.py

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          php -l portal/feed-reader-media.php
          php -l portal/feed-reader-core.php
          php -l portal/feed-reader-view.php
          php -l portal/feed-reader-api.php
          php -l portal/bootstrap.php
          node --check assets/js/feed-reader-social.js
          node --check tests/feed-reader-media-player-v66b.js
          php tests/feed-reader-media-v66b.php
          node tests/feed-reader-media-player-v66b.js

      - name: Commit finished application source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-feed-reader-media-v66b.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Feed Reader Media v66B"
          git push origin HEAD:${{ github.head_ref }}
