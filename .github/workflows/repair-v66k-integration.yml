name: Repair v66K Integration

on:
  push:
    branches:
      - feature/automation-routing-action-center-v66k-certified-20260730
    paths:
      - '.github/workflows/repair-v66k-integration.yml'

permissions:
  contents: write

concurrency:
  group: repair-v66k-integration
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automation-routing-action-center-v66k-certified-20260730
          fetch-depth: 0

      - name: Repair recovery and portal integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('portal/automation-rules.php')
          core = core_path.read_text(encoding='utf-8')

          old_bindings = """            $statement->execute($clean + [
      'rule_uuid' => automation_uuid(),
      'created_by_user_id' => $userId,
      'updated_by_user_id' => $userId,
  ]);"""
          new_bindings = """            $statement->execute($clean + [
                'rule_uuid' => automation_uuid(),
                'created_by_user_id' => $userId,
                'updated_by_user_id' => $userId,
            ]);"""
          if core.count(old_bindings) != 1:
              raise SystemExit(f'Expected one misindented rule binding block, found {core.count(old_bindings)}')
          core = core.replace(old_bindings, new_bindings, 1)

          old_rowcount = '        if ($statement->rowCount() !== 1) continue;'
          new_rowcount = '        if ($statement->rowCount() < 1) continue;'
          if core.count(old_rowcount) != 1:
              raise SystemExit(f'Expected one strict recovery row-count check, found {core.count(old_rowcount)}')
          core = core.replace(old_rowcount, new_rowcount, 1)
          core_path.write_text(core, encoding='utf-8')

          admin_path = Path('portal/admin.php')
          admin = admin_path.read_text(encoding='utf-8')

          old_require = "require_once __DIR__ . '/notification-delivery-admin.php';\n$user=require_role('admin');"
          new_require = "require_once __DIR__ . '/notification-delivery-admin.php';\nrequire_once __DIR__ . '/automation-admin.php';\n$user=require_role('admin');"
          if admin.count(old_require) != 1:
              raise SystemExit(f'Expected one notification-delivery require anchor, found {admin.count(old_require)}')
          admin = admin.replace(old_require, new_require, 1)

          old_allowed = "'feeds','site-analytics','settings','account'];"
          new_allowed = "'feeds','site-analytics','automation','settings','account'];"
          if admin.count(old_allowed) != 1:
              raise SystemExit(f'Expected one admin allowed-view anchor, found {admin.count(old_allowed)}')
          admin = admin.replace(old_allowed, new_allowed, 1)

          old_handler = """        if(notification_delivery_handle_admin_action($action,$user)){
            exit;
        }
        if(activitypub_handle_admin_action($action,$user)){"""
          new_handler = """        if(notification_delivery_handle_admin_action($action,$user)){
            exit;
        }
        if(automation_handle_admin_action($action,$user)){
            exit;
        }
        if(activitypub_handle_admin_action($action,$user)){"""
          if admin.count(old_handler) != 1:
              raise SystemExit(f'Expected one admin action-handler anchor, found {admin.count(old_handler)}')
          admin = admin.replace(old_handler, new_handler, 1)

          old_render = """if($view==='delivery'){
    notification_delivery_render_admin($user);
    portal_footer();
    exit;
}

if($view==='feeds'){"""
          new_render = """if($view==='delivery'){
    notification_delivery_render_admin($user);
    portal_footer();
    exit;
}

if($view==='automation'){
    automation_render_admin($user);
    portal_footer();
    exit;
}

if($view==='feeds'){"""
          if admin.count(old_render) != 1:
              raise SystemExit(f'Expected one admin render anchor, found {admin.count(old_render)}')
          admin = admin.replace(old_render, new_render, 1)
          admin_path.write_text(admin, encoding='utf-8')
          PY

      - name: Validate repaired integration
        run: |
          set -euo pipefail
          php -l portal/automation-rules.php
          php -l portal/admin.php
          php tests/automation-rules-v66k.php
          grep -F "require_once __DIR__ . '/automation-admin.php';" portal/admin.php >/dev/null
          grep -F "'automation'" portal/admin.php >/dev/null
          grep -F 'automation_handle_admin_action($action,$user)' portal/admin.php >/dev/null
          grep -F 'automation_render_admin($user)' portal/admin.php >/dev/null
          grep -F 'if ($statement->rowCount() < 1) continue;' portal/automation-rules.php >/dev/null

      - name: Remove repair controller and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-v66k-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/automation-rules.php portal/admin.php .github/workflows/repair-v66k-integration.yml
          git commit -m "Repair v66K portal integration and restart recovery"
          git push origin HEAD:feature/automation-routing-action-center-v66k-certified-20260730
