name: Apply Private Outbox and PDO Repairs v66P

on:
  push:
    branches:
      - feature/pod-social-post-publisher-v66p-20260731
    paths:
      - '.github/workflows/apply-private-outbox-v66p.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pod-social-post-publisher-v66p-20260731
          fetch-depth: 0
      - name: Apply privacy and database repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activity=Path('portal/activitypub-service.php')
          text=activity.read_text(encoding='utf-8')
          old='''function activitypub_outbox_document(): array
{
    activitypub_require_schema();
    $count = (int)db()->query(
        'SELECT COUNT(*) FROM activitypub_outbox_activities
         WHERE activity_type IN ("Create","Update","Delete")'
    )->fetchColumn();
    $rows = db()->query(
        'SELECT payload_json FROM activitypub_outbox_activities
         WHERE activity_type IN ("Create","Update","Delete")
         ORDER BY published_at DESC,id DESC LIMIT 50'
    )->fetchAll();
    $items = [];
    foreach ($rows as $row) {
        $payload = json_decode((string)$row['payload_json'], true);
        if (is_array($payload)) $items[] = $payload;
    }
    return [
        '@context' => 'https://www.w3.org/ns/activitystreams',
        'id' => activitypub_outbox_url(),
        'type' => 'OrderedCollection',
        'totalItems' => $count,
        'orderedItems' => $items,
    ];
}
'''
          new='''function activitypub_audience_contains_public(mixed $audience): bool
{
    $public = 'https://www.w3.org/ns/activitystreams#Public';
    if (is_string($audience)) {
        return activitypub_normalize_url($audience) === activitypub_normalize_url($public);
    }
    if (!is_array($audience)) return false;
    foreach ($audience as $value) {
        if (activitypub_audience_contains_public($value)) return true;
    }
    return false;
}

function activitypub_payload_is_public(array $payload): bool
{
    foreach (['to', 'cc', 'audience'] as $field) {
        if (activitypub_audience_contains_public($payload[$field] ?? null)) return true;
    }
    $object = $payload['object'] ?? null;
    if (is_array($object)) {
        foreach (['to', 'cc', 'audience'] as $field) {
            if (activitypub_audience_contains_public($object[$field] ?? null)) return true;
        }
    }
    return false;
}

function activitypub_outbox_document(): array
{
    activitypub_require_schema();
    $statement = db()->prepare(
        'SELECT payload_json FROM activitypub_outbox_activities
         WHERE activity_type IN ("Create","Update","Delete")
           AND payload_json LIKE :public_marker
         ORDER BY published_at DESC,id DESC'
    );
    $statement->execute([
        'public_marker' => '%https://www.w3.org/ns/activitystreams#Public%',
    ]);
    $items = [];
    $count = 0;
    while ($row = $statement->fetch()) {
        $payload = json_decode((string)$row['payload_json'], true);
        if (!is_array($payload) || !activitypub_payload_is_public($payload)) continue;
        $count++;
        if (count($items) < 50) $items[] = $payload;
    }
    return [
        '@context' => 'https://www.w3.org/ns/activitystreams',
        'id' => activitypub_outbox_url(),
        'type' => 'OrderedCollection',
        'totalItems' => $count,
        'orderedItems' => $items,
    ];
}
'''
          if new not in text:
              if old not in text: raise SystemExit('Outbox function anchor not found.')
              text=text.replace(old,new,1)
          activity.write_text(text,encoding='utf-8')

          service=Path('portal/social-posts-service.php')
          text=service.read_text(encoding='utf-8')
          text=text.replace('WHEN :published="published" THEN COALESCE(published_at,UTC_TIMESTAMP())','WHEN :publish_state="published" THEN COALESCE(published_at,UTC_TIMESTAMP())',1)
          text=text.replace('edited_at=CASE WHEN :published="published" THEN UTC_TIMESTAMP() ELSE edited_at END','edited_at=CASE WHEN :edit_state="published" THEN UTC_TIMESTAMP() ELSE edited_at END',1)
          text=text.replace("        'published' => $status,\n        'id' => $postId,","        'publish_state' => $status,\n        'edit_state' => $status,\n        'id' => $postId,",1)
          if ':published="published"' in text:
              raise SystemExit('Duplicate PDO published placeholder remains.')
          service.write_text(text,encoding='utf-8')

          source=Path('tests/social-posts-v66p.php')
          text=source.read_text(encoding='utf-8')
          text=text.replace("    'service' => 'portal/social-posts-service.php',","    'service' => 'portal/social-posts-service.php',\n    'activitypub' => 'portal/activitypub-service.php',",1)
          anchor="$expect('service', 'activitypub_queue_approved_followers', 'Delivery must reuse approved ActivityPub followers.');"
          addition=anchor+"\n$expect('activitypub', 'activitypub_payload_is_public', 'Public outbox audience filtering is required.');\n$expect('activitypub', 'AND payload_json LIKE :public_marker', 'Public outbox must prefilter public payload candidates.');"
          if 'Public outbox audience filtering is required.' not in text:
              if anchor not in text: raise SystemExit('Source test ActivityPub anchor not found.')
              text=text.replace(anchor,addition,1)
          text=text.replace("    '.github/workflows/apply-social-posts-navigation-v66p.yml',","    '.github/workflows/apply-social-posts-navigation-v66p.yml',\n    '.github/workflows/apply-private-outbox-v66p.yml',",1)
          source.write_text(text,encoding='utf-8')

          dbtest=Path('tests/social-posts-db-v66p.php')
          text=dbtest.read_text(encoding='utf-8')
          anchor="""    if (in_array($followersId, $publicIds, true)) {
        $fail('Followers-only post leaked into the public feed.');
    }
"""
          addition=anchor+"""

    $publicOutbox = activitypub_outbox_document();
    if ((int)($publicOutbox['totalItems'] ?? 0) !== 3) {
        $fail('Public outbox count includes a follower-only activity or omits a public activity.');
    }
    foreach (($publicOutbox['orderedItems'] ?? []) as $activity) {
        if (!is_array($activity) || !activitypub_payload_is_public($activity)) {
            $fail('Public outbox exposed a non-public activity.');
        }
        $objectUri = (string)($activity['object']['id'] ?? $activity['object'] ?? '');
        if ($objectUri === social_posts_object_url($followers)) {
            $fail('Followers-only social post leaked into the public ActivityPub outbox.');
        }
    }
"""
          if 'Followers-only social post leaked into the public ActivityPub outbox.' not in text:
              if anchor not in text: raise SystemExit('Database test public feed anchor not found.')
              text=text.replace(anchor,addition,1)
          dbtest.write_text(text,encoding='utf-8')

          quality=Path('.github/workflows/social-posts-quality.yml')
          text=quality.read_text(encoding='utf-8')
          text=text.replace("      - 'portal/social-posts-service.php'","      - 'portal/social-posts-service.php'\n      - 'portal/activitypub-service.php'",1)
          text=text.replace("            portal/social-posts-service.php portal/social-posts.php \\","            portal/social-posts-service.php portal/activitypub-service.php portal/social-posts.php \\",1)
          text=text.replace("          test ! -e .github/workflows/apply-social-posts-navigation-v66p.yml","          test ! -e .github/workflows/apply-social-posts-navigation-v66p.yml\n          test ! -e .github/workflows/apply-private-outbox-v66p.yml",1)
          quality.write_text(text,encoding='utf-8')
          PY
      - name: Validate repaired sources
        run: |
          set -euo pipefail
          php -l portal/activitypub-service.php
          php -l portal/social-posts-service.php
          php -l tests/social-posts-v66p.php
          php -l tests/social-posts-db-v66p.php
          php tests/activitypub-v66f.php
          php tests/stories-v66o.php
          php tests/social-posts-v66p.php
      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/activitypub-service.php portal/social-posts-service.php tests/social-posts-v66p.php tests/social-posts-db-v66p.php .github/workflows/social-posts-quality.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Social Posts PDO update and public outbox privacy'
          git push origin HEAD:feature/pod-social-post-publisher-v66p-20260731
