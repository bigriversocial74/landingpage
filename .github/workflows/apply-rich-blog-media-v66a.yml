name: Apply Rich Blog Media v66A

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply-rich-blog-media-v66a.py
      - .github/workflows/apply-rich-blog-media-v66a.yml

permissions:
  contents: write

concurrency:
  group: rich-blog-media-v66a
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/rich-blog-media-v66a-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize deterministic patch boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/apply-rich-blog-media-v66a.py')
          source=path.read_text(encoding='utf-8')
          for marker in [
              'replace_once(\n    "portal/publishing-admin.php",\n    "Body content supports',
              'replace_once(\n    "portal/publishing-admin.php",\n    "Use ## Heading',
          ]:
              start=source.find(marker)
              if start < 0:
                  continue
              end=source.find('\nreplace_once(', start + len(marker))
              if end < 0:
                  raise SystemExit(f'Unable to close optional patch block: {marker}')
              source=source[:start]+source[end+1:]
          path.write_text(source,encoding='utf-8')
          PY

      - name: Apply deterministic patch
        run: python3 tools/apply-rich-blog-media-v66a.py

      - name: Validate focused source
        shell: bash
        run: |
          set -euo pipefail
          php -l portal/blog-rich-media.php
          php -l portal/publishing.php
          php -l portal/publishing-admin.php
          php -l portal/publishing-workflow-view.php
          php -l blog-post.php
          php -l portal/blog-feed-output.php
          node --check assets/js/blog-rich-media-admin.js
          node --check assets/js/blog-rich-media.js
          php tests/rich-blog-media-v66a.php

      - name: Commit finished feature
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-rich-blog-media-v66a.py .github/workflows/apply-rich-blog-media-v66a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Rich Blog Media v66A"
          git push origin HEAD:${{ github.head_ref }}
