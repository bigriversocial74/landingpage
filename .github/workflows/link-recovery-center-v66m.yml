name: Temporary v66M Operations link

on:
  push:
    branches:
      - feature/incident-response-runbooks-recovery-center-v66m-20260731
    paths:
      - 'tools/link-recovery-center-v66m.py'
      - '.github/workflows/link-recovery-center-v66m.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/incident-response-runbooks-recovery-center-v66m-20260731
      - run: python3 tools/link-recovery-center-v66m.py
      - run: php -l portal/operations-analytics-extensions.php
      - name: Commit Operations entry
        run: |
          set -euo pipefail
          if git diff --quiet -- portal/operations-analytics-extensions.php; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/operations-analytics-extensions.php
          git commit -m 'Link Operations Analytics to Recovery Center'
          git push origin HEAD:feature/incident-response-runbooks-recovery-center-v66m-20260731
