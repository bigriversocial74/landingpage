name: Repair Publishing Center v66Q

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply module and retained-contract repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing repair anchor: {label}')
              return text.replace(old, new, 1)

          # Restore retained Social Posts disclosures in the feed-first UI.
          path='portal/social-posts.php'
          text=read(path)
          anchor='''</div>\n\n<?php if(!$schemaAvailable):?>'''
          disclosure='''</div>\n<p class="social-feed-guidance">Create a post with Publishing +, publish immediately, or choose <strong>Save draft</strong> for later. Blog and RSS remain independent from the Social Feed.</p>\n\n<?php if(!$schemaAvailable):?>'''
          text=replace_once(text,anchor,disclosure,'social feed disclosures')
          write(path,text)

          # Disable automatic landing integration when Social Feed is disabled and hide RSS links when RSS is disabled.
          path='portal/social-posts-service.php'
          text=read(path)
          anchor='''function social_posts_render_landing(): void\n{\n    $settings = social_posts_settings();'''
          replacement='''function social_posts_render_landing(): void\n{\n    if (function_exists('nmm_module_enabled') && !nmm_module_enabled('social_feed')) return;\n    $settings = social_posts_settings();'''
          text=replace_once(text,anchor,replacement,'social landing module guard')
          rss='<div class="pod-rss-link"><a href="<?=e(app_url(\'blog-feed.php\'))?>">RSS feed</a></div>'
          guarded='<?php if(nmm_module_enabled(\'rss\')):?><div class="pod-rss-link"><a href="<?=e(app_url(\'blog-feed.php\'))?>">RSS feed</a></div><?php endif;?>'
          if rss not in text:
              raise SystemExit('Missing RSS landing link')
          text=text.replace(rss,guarded)
          write(path,text)

          # Gate the public Social Feed page.
          path='social-feed.php'
          text=read(path)
          anchor="require_once __DIR__ . '/portal/public-syndication.php';"
          replacement=anchor+"\n\nnmm_require_public_module('social_feed');"
          if "nmm_require_public_module('social_feed');" not in text:
              text=replace_once(text,anchor,replacement,'public social feed module guard')
          write(path,text)

          # Suppress all feed discovery when the RSS module is disabled.
          path='portal/public-syndication.php'
          text=read(path)
          anchor='''function syndication_discovery_links(?array $filter = null, bool $includeWebmention = true): string\n{\n    $settings = syndication_settings();'''
          replacement='''function syndication_discovery_links(?array $filter = null, bool $includeWebmention = true): string\n{\n    if (function_exists('nmm_module_enabled') && !nmm_module_enabled('rss')) return '';\n    $settings = syndication_settings();'''
          text=replace_once(text,anchor,replacement,'RSS discovery module guard')
          write(path,text)

          # Gate public feed and directory endpoints.
          for path in ['blog-feed.php','blog-atom.php','blog-json-feed.php','podcast-feed.php','blog-feeds.php']:
              text=read(path)
              if "nmm_require_public_module('rss');" not in text:
                  anchor="nmm_require_public_module('blog');"
                  if anchor not in text:
                      raise SystemExit(f'Missing blog module guard in {path}')
                  text=text.replace(anchor,anchor+"\nnmm_require_public_module('rss');",1)
              write(path,text)

          # One module may own more than one sidebar destination.
          path='portal/bootstrap.php'
          text=read(path)
          old='''        $moduleNavigationMap = [\n  'clients' => ['Relationships','clients'],\n  'leads' => ['Relationships','leads'],\n  'portfolio' => ['Work','portfolio'],\n  'resume' => ['Work','resume'],\n  'music_library' => ['Operations','music'],\n  'blog' => ['Work','blog'],\n  'rss' => ['Work','syndication'],\n  'social_feed' => ['Work','social-posts'],\n  'events' => ['Work','events'],\n  'bookings' => ['Work','bookings'],\n        ];\n        foreach ($moduleNavigationMap as $moduleKey => [$groupName,$itemKey]) {\n  if (!nmm_module_enabled($moduleKey)) unset($adminNavigationGroups[$groupName][$itemKey]);\n        }'''
          new='''        $moduleNavigationMap = [\n            'clients' => [\n                ['Relationships','clients'],\n                ['Work','projects'],\n                ['Work','files'],\n            ],\n            'leads' => [['Relationships','leads']],\n            'portfolio' => [['Work','portfolio']],\n            'resume' => [['Work','resume']],\n            'music_library' => [['Operations','music']],\n            'blog' => [['Work','blog']],\n            'rss' => [['Work','syndication']],\n            'social_feed' => [['Work','social-posts']],\n            'events' => [['Work','events']],\n            'bookings' => [['Work','bookings']],\n        ];\n        foreach ($moduleNavigationMap as $moduleKey => $locations) {\n            if (nmm_module_enabled($moduleKey)) continue;\n            foreach ($locations as [$groupName,$itemKey]) {\n                unset($adminNavigationGroups[$groupName][$itemKey]);\n            }\n        }'''
          text=replace_once(text,old,new,'multi-target module navigation')
          write(path,text)

          # Make the focused contract cover public module enforcement.
          write('tests/publishing-center-v66q.php', '''<?php\ndeclare(strict_types=1);\n$root=dirname(__DIR__);\n$checks=[\n 'portal/publishing-center.php'=>['publishing_center_catalog','data-publishing-option','portal/publish-story.php'],\n 'portal/bootstrap.php'=>['Publishing +','data-portal-active','moduleNavigationMap',"['Work','projects']",'publishing_center_render_modal'],\n 'portal/admin.php'=>["??'agent'",'agent_chat_render'],\n 'portal/social-posts.php'=>['Posts and Stories','stories_render_rail','data-publishing-open="social-post"','Save draft','Blog and RSS remain independent'],\n 'portal/social-posts-service.php'=>["nmm_module_enabled('social_feed')","nmm_module_enabled('rss')"],\n 'social-feed.php'=>["nmm_require_public_module('social_feed')"],\n 'portal/public-syndication.php'=>["nmm_module_enabled('rss')"],\n 'blog-feed.php'=>["nmm_require_public_module('rss')"],\n 'blog-atom.php'=>["nmm_require_public_module('rss')"],\n 'blog-json-feed.php'=>["nmm_require_public_module('rss')"],\n 'podcast-feed.php'=>["nmm_require_public_module('rss')"],\n 'blog-feeds.php'=>["nmm_require_public_module('rss')"],\n 'assets/js/portal.js'=>['nmm.portal.navigation.','dataset.portalActive'],\n 'portal/site-settings.php'=>["'clients' =>","'leads' =>","'rss' =>","'social_feed' =>","'stories' =>"],\n];\nforeach($checks as $file=>$needles){$content=file_get_contents($root.'/'.$file);if($content===false)throw new RuntimeException('Missing '.$file);foreach($needles as $needle)if(!str_contains($content,$needle))throw new RuntimeException($file.' missing '.$needle);}\nforeach(['.github/workflows/build-publishing-center-v66q.yml','.github/workflows/run-publishing-builder-v66q.yml','.github/v66q-build-trigger'] as $temporary){if(is_file($root.'/'.$temporary))throw new RuntimeException('Temporary v66Q artifact remains: '.$temporary);}\necho "Publishing Center v66Q source and module contract passed\\n";\n''')

          # Small visual treatment for the retained guidance.
          path='assets/css/publishing-center-v66q.css'
          text=read(path)
          if '.social-feed-guidance{' not in text:
              text += '\n.social-feed-guidance{margin:-6px 0 16px;padding:11px 14px;border:1px solid #dfe6ec;border-radius:13px;background:#fff;color:#647285;font-size:13px;line-height:1.45}\n'
          write(path,text)
          PY
      - name: Validate repaired source
        run: |
          php -l portal/social-posts.php
          php -l portal/social-posts-service.php
          php -l social-feed.php
          php -l portal/public-syndication.php
          php -l blog-feed.php
          php -l blog-atom.php
          php -l blog-json-feed.php
          php -l podcast-feed.php
          php -l blog-feeds.php
          php -l portal/bootstrap.php
          php tests/publishing-center-v66q.php
          php tests/social-posts-v66p.php
          node --check assets/js/portal.js
          node --check assets/js/publishing-center-v66q.js
      - name: Commit permanent repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/publishing-center-v66q.css portal/bootstrap.php portal/public-syndication.php portal/social-posts.php portal/social-posts-service.php social-feed.php blog-feed.php blog-atom.php blog-json-feed.php podcast-feed.php blog-feeds.php tests/publishing-center-v66q.php
          git commit -m "Harden Publishing Center module boundaries v66Q"
          git push origin HEAD:${{ github.head_ref }}
