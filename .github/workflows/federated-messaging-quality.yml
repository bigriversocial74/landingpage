name: Federated Messaging Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/federated-messaging-quality.yml'
      - 'portal/federated-messaging.php'
      - 'portal/federated-messages.php'
      - 'portal/activitypub-service.php'
      - 'portal/unified-inbox.php'
      - 'portal/activitypub-admin.php'
      - 'portal/homeserver-adapter.php'
      - 'activitypub-message.php'
      - 'assets/css/federated-messaging.css'
      - 'cron/process-activitypub.php'
      - 'database/federated_messaging_v66i.sql'
      - 'database/north_mountain_portal.sql'
      - 'tests/federated-messaging-v66i.php'
      - 'tests/federated-messaging-db-v66i.php'
      - 'V66I-SCORECARD.md'
      - 'V66I-VALIDATION.txt'
      - 'FEDERATED-MESSAGING-SETUP-v66I.md'

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in \
            portal/federated-messaging.php portal/federated-messages.php \
            portal/activitypub-service.php portal/unified-inbox.php \
            portal/activitypub-admin.php portal/homeserver-adapter.php \
            activitypub-message.php cron/process-activitypub.php \
            tests/federated-messaging-v66i.php tests/federated-messaging-db-v66i.php; do
              php -l "$file"
          done
      - name: Source, privacy, and security regression
        run: php tests/federated-messaging-v66i.php
      - name: Schema and cleanup contract
        run: |
          set -euo pipefail
          for table in \
            activitypub_message_threads activitypub_messages \
            activitypub_message_user_state activitypub_message_events \
            activitypub_message_assistance; do
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/federated_messaging_v66i.sql)" = "1"
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/north_mountain_portal.sql)" = "1"
          done
          test ! -e tools/apply-federated-messaging-v66i.py
          test ! -e .github/workflows/apply-federated-messaging-v66i.yml
          grep -F "federated_messaging_process_inbound" portal/activitypub-service.php >/dev/null
          grep -F "federated_messaging_sync_delivery" portal/activitypub-service.php >/dev/null
          grep -F "federated_messaging_reset_delivery" portal/activitypub-service.php >/dev/null
          grep -F "federated_messaging_cleanup" cron/process-activitypub.php >/dev/null
          grep -F "'proposal_only' => true" portal/federated-messaging.php >/dev/null
          grep -F "'send_allowed' => false" portal/federated-messaging.php >/dev/null
          grep -F "'wrapper' => 'rss-pod'" portal/federated-messaging.php >/dev/null
          if grep -F '<img' portal/federated-messages.php; then exit 1; fi
          if grep -F '<audio' portal/federated-messages.php; then exit 1; fi
          if grep -F '<video' portal/federated-messages.php; then exit 1; fi
          if grep -F '<iframe' portal/federated-messages.php; then exit 1; fi

  mysql-8-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nmm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP database extensions
        run: sudo apt-get update && sudo apt-get install -y php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nmm < database/north_mountain_portal.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/federated_messaging_v66i.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/federated_messaging_v66i.sql
      - name: Live Federated Messaging database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/federated-messaging-db-v66i.php

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nmm
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client and PHP extensions
        run: sudo apt-get update && sudo apt-get install -y mariadb-client php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/north_mountain_portal.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/federated_messaging_v66i.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/federated_messaging_v66i.sql
      - name: Live Federated Messaging database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/federated-messaging-db-v66i.php
