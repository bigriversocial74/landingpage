name: Fix Unified Inbox Priority v66D

on:
  pull_request:
    branches: [main]
    paths:
      - tools/fix-unified-inbox-priority-v66d.py
      - .github/workflows/fix-unified-inbox-priority-v66d.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/unified-social-inbox-v66d-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply priority repair
        run: python3 tools/fix-unified-inbox-priority-v66d.py
      - name: Validate priority repair
        run: |
          set -euo pipefail
          php -l portal/unified-inbox.php
          grep -F "native_priority'] ?? \$values['priority']" portal/unified-inbox.php >/dev/null
      - name: Commit priority repair
        run: |
          set -euo pipefail
          rm -f tools/fix-unified-inbox-priority-v66d.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/unified-inbox.php tools/fix-unified-inbox-priority-v66d.py
          git commit -m "Preserve native Unified Inbox priorities"
          git push origin HEAD:${{ github.head_ref }}
