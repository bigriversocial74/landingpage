name: ActivityPub Federation Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/activitypub-federation-quality.yml'
      - 'portal/activitypub*.php'
      - 'portal/admin.php'
      - 'portal/bootstrap.php'
      - 'portal/publishing-admin.php'
      - 'portal/pod-identity.php'
      - 'assets/css/activitypub-admin.css'
      - 'activitypub-*.php'
      - 'webfinger.php'
      - 'nodeinfo*.php'
      - 'blog.php'
      - 'blog-post.php'
      - 'cron/process-activitypub.php'
      - 'database/activitypub_federation_v66f.sql'
      - 'database/north_mountain_portal.sql'
      - 'config-example.php'
      - '.htaccess'
      - 'tests/activitypub-v66f.php'
      - 'tests/activitypub-db-v66f.php'
      - 'V66F-SCORECARD.md'
      - 'V66F-VALIDATION.txt'
      - 'ACTIVITYPUB-FEDERATION-SETUP-v66F.md'

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in \
            portal/activitypub.php portal/activitypub-http.php \
            portal/activitypub-service.php portal/activitypub-admin.php \
            portal/admin.php portal/bootstrap.php portal/publishing-admin.php \
            portal/pod-identity.php blog.php blog-post.php webfinger.php \
            nodeinfo-discovery.php nodeinfo.php activitypub-actor.php \
            activitypub-inbox.php activitypub-outbox.php \
            activitypub-followers.php activitypub-following.php \
            activitypub-activity.php activitypub-object.php \
            cron/process-activitypub.php tests/activitypub-v66f.php \
            tests/activitypub-db-v66f.php; do
              php -l "$file"
          done
      - name: Protocol, crypto, and security regression
        run: php tests/activitypub-v66f.php
      - name: Schema and cleanup contract
        run: |
          set -euo pipefail
          for table in \
            activitypub_actor_keys activitypub_remote_actors \
            activitypub_followers activitypub_inbox_activities \
            activitypub_outbox_activities activitypub_deliveries; do
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/activitypub_federation_v66f.sql)" = "1"
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/north_mountain_portal.sql)" = "1"
          done
          test ! -e tools/apply-activitypub-v66f.py
          test ! -e .github/workflows/apply-activitypub-v66f.yml
          test ! -e tools/harden-activitypub-v66f.py
          test ! -e .github/workflows/harden-activitypub-v66f.yml
          test ! -e tools/repair-activitypub-certification-v66f.py
          test ! -e .github/workflows/repair-activitypub-certification-v66f.yml
          grep -F 'CURLOPT_RESOLVE' portal/activitypub-http.php >/dev/null
          grep -F "CURLOPT_PROXY => ''" portal/activitypub-http.php >/dev/null
          grep -F 'CURLOPT_FOLLOWLOCATION => false' portal/activitypub-http.php >/dev/null
          grep -F 'activitypub_secret' config-example.php >/dev/null

  mysql-8-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nmm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP database extensions
        run: sudo apt-get update && sudo apt-get install -y php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nmm < database/north_mountain_portal.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/activitypub_federation_v66f.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/activitypub_federation_v66f.sql
      - name: Live ActivityPub database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/activitypub-db-v66f.php

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nmm
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client and PHP extensions
        run: sudo apt-get update && sudo apt-get install -y mariadb-client php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/north_mountain_portal.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/activitypub_federation_v66f.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/activitypub_federation_v66f.sql
      - name: Live ActivityPub database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/activitypub-db-v66f.php
