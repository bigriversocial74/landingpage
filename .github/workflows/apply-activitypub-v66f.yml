name: Apply ActivityPub Federation v66F

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-activitypub-v66f.py
      - .github/workflows/apply-activitypub-v66f.yml

permissions:
  contents: write

concurrency:
  group: apply-activitypub-v66f
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/activitypub-federation-v66f-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Harden deterministic delete-query anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-activitypub-v66f.py')
          content = path.read_text(encoding='utf-8')
          old = '''publishing = replace_once(
              publishing,
              \'''            'SELECT id,title
                       FROM blog_posts
          \''',
              \'''            'SELECT post.*,user.display_name AS author_name
                       FROM blog_posts post
                       LEFT JOIN users user ON user.id=post.author_user_id
          \''',
              'blog delete full snapshot query',
          )
          publishing = replace_once(
              publishing,
              \'''             WHERE id=:id
          \''',
              \'''             WHERE post.id=:id
          \''',
              'blog delete snapshot query identifier',
          )
          '''
          new = '''publishing = replace_once(
              publishing,
              \'''            'SELECT id,title
                       FROM blog_posts
                       WHERE id=:id
                       LIMIT 1'
          \''',
              \'''            'SELECT post.*,user.display_name AS author_name
                       FROM blog_posts post
                       LEFT JOIN users user ON user.id=post.author_user_id
                       WHERE post.id=:id
                       LIMIT 1'
          \''',
              'blog delete full snapshot query',
          )
          '''
          if content.count(old) != 1:
              raise SystemExit('delete-query patch anchor mismatch')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply deterministic integration
        run: python3 tools/apply-activitypub-v66f.py
      - name: Focused validation
        run: |
          set -euo pipefail
          php -l portal/activitypub.php
          php -l portal/activitypub-http.php
          php -l portal/activitypub-service.php
          php -l portal/activitypub-admin.php
          php -l portal/admin.php
          php -l portal/bootstrap.php
          php -l portal/publishing-admin.php
          php -l portal/pod-identity.php
          php -l blog.php
          php -l blog-post.php
          php -l webfinger.php
          php -l nodeinfo-discovery.php
          php -l nodeinfo.php
          php -l activitypub-actor.php
          php -l activitypub-inbox.php
          php -l activitypub-outbox.php
          php -l activitypub-followers.php
          php -l activitypub-following.php
          php -l activitypub-activity.php
          php -l activitypub-object.php
          php -l cron/process-activitypub.php
          grep -F "'federation' => 'Federation'" portal/bootstrap.php >/dev/null
          grep -F 'activitypub_handle_admin_action' portal/admin.php >/dev/null
          grep -F 'activitypub_blog_event' portal/publishing-admin.php >/dev/null
          grep -F 'RewriteRule ^\.well-known/webfinger$' .htaccess >/dev/null
          grep -F "'activitypub_secret'" config-example.php >/dev/null
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS activitypub_actor_keys' database/north_mountain_portal.sql)" = "1"
      - name: Commit integrated application source
        run: |
          set -euo pipefail
          rm -f tools/apply-activitypub-v66f.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .htaccess portal/admin.php portal/bootstrap.php portal/publishing-admin.php portal/pod-identity.php portal/activitypub-service.php blog.php blog-post.php config-example.php database/north_mountain_portal.sql tools/apply-activitypub-v66f.py
          git commit -m "Integrate ActivityPub Federation v66F"
          git push origin HEAD:${{ github.head_ref }}
