name: Temporary v66M certification repair

on:
  push:
    branches:
      - feature/incident-response-runbooks-recovery-center-v66m-20260731
    paths:
      - 'tools/repair-v66m-certification.py'
      - '.github/workflows/repair-v66m-certification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/incident-response-runbooks-recovery-center-v66m-20260731
      - run: python3 tools/repair-v66m-certification.py
      - run: |
          php -l tests/incident-response-db-v66m.php
          python3 - <<'PY'
          import yaml
          yaml.safe_load(open('.github/workflows/incident-response-quality.yml'))
          PY
      - name: Commit certification repair
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/incident-response-db-v66m.php .github/workflows/incident-response-quality.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/incident-response-db-v66m.php .github/workflows/incident-response-quality.yml
          git commit -m 'Repair v66M native PDO fixture and workflow coverage'
          git push origin HEAD:feature/incident-response-runbooks-recovery-center-v66m-20260731
