name: Apply Complete Automation Rules v66K Final macOS

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-complete-automation-rules-v66k-final-macos.yml'
      - 'tools/restart-safety-finalize-automation-rules-v66k-v3.py'

permissions:
  contents: write

jobs:
  apply-complete-final-macos:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-final-20260730'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply complete reviewed integration
        run: |
          set -euo pipefail
          python3 tools/restart-safety-finalize-automation-rules-v66k-v3.py
      - name: Install PHP when absent
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null; then
            brew install php
          fi
      - name: Validate complete syntax
        run: |
          set -euo pipefail
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
      - name: Commit complete application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            database/automation_rules_v66k.sql \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Complete Automation Rules v66K implementation'
          git push origin HEAD:${{ github.head_ref }}
