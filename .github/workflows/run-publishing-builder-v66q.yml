name: Run Publishing Center Builder v66Q

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute reviewed builder payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/build-publishing-center-v66q.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,line in enumerate(source) if "python3 - <<'PY'" in line)+1
          end=next(i for i in range(start,len(source)) if source[i].strip()=='PY')
          payload='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])+'\n'
          Path('/tmp/build-v66q.py').write_text(payload,encoding='utf-8')
          PY
          python3 /tmp/build-v66q.py
          rm -f .github/workflows/run-publishing-builder-v66q.yml .github/v66q-build-trigger
      - name: Validate generated source
        run: |
          php -l portal/publishing-center.php
          php -l portal/agent-chat-view.php
          php -l portal/publish-social-post.php
          php -l portal/publish-story.php
          php -l portal/social-posts.php
          php -l portal/bootstrap.php
          php -l portal/admin.php
          node --check assets/js/portal.js
          node --check assets/js/publishing-center-v66q.js
          php tests/publishing-center-v66q.php
      - name: Commit permanent implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Publishing Center and Agent Chat v66Q"
          git push origin HEAD:${{ github.head_ref }}
