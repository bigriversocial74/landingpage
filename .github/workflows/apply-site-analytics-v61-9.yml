name: Apply Site Analytics v61.9 Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/site-analytics-listening-sidebar-v61-9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply validated repair patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/v619.patch.b64 | gzip -d > /tmp/v619.patch
          git apply --check /tmp/v619.patch
          git apply /tmp/v619.patch
          python3 <<'PY'
          from pathlib import Path
          old = 'assets/js/music-player.js?v=20260727-site-controls-landing-v60'
          new = 'assets/js/music-player.js?v=20260728-site-analytics-v61.9'
          changed = 0
          for path in Path('.').rglob('*.php'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              updated = source.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed < 2:
              raise SystemExit(f'Expected at least two Music Player cache references, updated {changed}.')
          PY

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -type f -name '*.js' -print0)

      - name: CSS structure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

      - name: Portal regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php
          php tests/landing-page-editor-v61-4.php
          php tests/landing-page-editor-v61-5.php
          php tests/landing-page-editor-v61-8.php
          php tests/site-analytics-listening-v61-9.php

      - name: Publish generated production commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tests/site-analytics-listening-v61-9.php
          git diff --cached --check
          git commit -m 'Repair site analytics listening and sidebar v61.9'
          git push --force origin HEAD:generated/site-analytics-v61-9
