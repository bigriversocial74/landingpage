name: Run My Feed and Agent Integration v66Q.3

on:
  push:
    branches:
      - repair/my-feed-agent-integration-v66q3-20260731

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/my-feed-agent-integration-v66q3-20260731
          fetch-depth: 0

      - name: Apply controlled repair source
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/repair-my-feed-agent-integration-v66q3.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'v66q3-repair.py', 'exec'))
          PY

      - name: Validate repaired source
        run: |
          php -l portal/bootstrap.php
          php -l portal/social-posts.php
          php -l portal/publishing-center.php
          php -l tests/my-feed-agent-navigation-v66q3.php
          node --check assets/js/portal.js
          node --check assets/js/publishing-center-v66q.js
          php tests/my-feed-agent-navigation-v66q3.php
          test ! -f tests/publishing-center-v66q.php || php tests/publishing-center-v66q.php
          test ! -f tests/publishing-agent-repair-v66q1.php || php tests/publishing-agent-repair-v66q1.php
          test ! -f tests/publishing-agent-runtime-v66q2.php || php tests/publishing-agent-runtime-v66q2.php
          test ! -f tests/social-posts-v66p.php || php tests/social-posts-v66p.php

      - name: Commit permanent repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/bootstrap.php portal/social-posts.php portal/publishing-center.php \
            assets/js/portal.js assets/js/publishing-center-v66q.js assets/css/portal.css \
            tests/my-feed-agent-navigation-v66q3.php
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "Integrate Agent chat and repair My Feed v66Q.3"
          git push origin HEAD:repair/my-feed-agent-integration-v66q3-20260731
