name: Diagnose Content Controls v62.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/content-delete-controls-v62-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct production source and test
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/v621.patch.b64.part00 \
            tools/v621.patch.b64.part01 \
            tools/v621.patch.b64.part02 \
            tools/v621.patch.b64.part03 \
            tools/v621.patch.b64.part04 \
            tools/v621.patch.b64.part05 \
            tools/v621.patch.b64.part06a \
            tools/v621.patch.b64.part06b > /tmp/v621.patch.gz.b64
          base64 -d /tmp/v621.patch.gz.b64 | gzip -d > /tmp/v621.patch
          git show origin/build/content-controls-v62-1:tools/content-delete-controls-v62-1.php.b64 > /tmp/content-delete-controls-v62-1.php.b64
          sha256sum /tmp/content-delete-controls-v62-1.php.b64 > /tmp/v621-regression-output.txt
          base64 -d /tmp/content-delete-controls-v62-1.php.b64 > /tmp/content-delete-controls-v62-1.php
          sha256sum /tmp/content-delete-controls-v62-1.php >> /tmp/v621-regression-output.txt
          git reset --hard ad8c16a186c436821a25579d3419f6421dd0142b
          git clean -fdx
          git apply /tmp/v621.patch
          install -m 0644 /tmp/content-delete-controls-v62-1.php tests/content-delete-controls-v62-1.php

      - name: Capture focused regression output
        shell: bash
        run: |
          set +e
          php tests/content-delete-controls-v62-1.php >> /tmp/v621-regression-output.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> /tmp/v621-regression-output.txt
          cat /tmp/v621-regression-output.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: content-controls-v62-1-regression-output
          path: /tmp/v621-regression-output.txt
