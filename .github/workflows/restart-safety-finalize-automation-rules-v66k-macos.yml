name: Restart Safety Finalize Automation Rules v66K macOS

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/restart-safety-finalize-automation-rules-v66k-macos.yml'

permissions:
  contents: write

jobs:
  restart-safety-macos:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-20260730'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply complete reviewed finalization
        run: |
          set -euo pipefail
          python3 tools/restart-safety-finalize-automation-rules-v66k.py
      - name: Validate patched source
        run: |
          set -euo pipefail
          command -v php >/dev/null
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
          grep -F 'automation_recover_interrupted_approvals' portal/automation-rules.php >/dev/null
          grep -F 'WHERE id=:id AND status="approved"' portal/automation-rules.php >/dev/null
          grep -F 'FOREIGN KEY (event_id) REFERENCES automation_events(id) ON DELETE SET NULL' database/automation_rules_v66k.sql >/dev/null
          grep -F "array_replace(\$settings, ['enabled' => false])" portal/automation-admin.php >/dev/null
          ! grep -F 'DELETE FROM automation_rules' portal/automation-admin.php
      - name: Commit complete application patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            database/automation_rules_v66k.sql \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Complete Automation Rules v66K integration and safety'
          git push origin HEAD:${{ github.head_ref }}
