name: Repair RSS v62 Payload Byte

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/rss-reader-platform-v62'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair and verify final payload chunk
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/v62.patch.b64.part07')
          data = bytearray(path.read_bytes())
          if len(data) != 5964:
              raise SystemExit(f'Unexpected part07 size: {len(data)}')
          if data[956] == ord('l'):
              data[956] = ord('j')
              path.write_bytes(data)
          elif data[956] != ord('j'):
              raise SystemExit(f'Unexpected byte at offset 956: {data[956]}')
          PY
          echo '30a193dafc50627300eea793d3497a35fdf387de482547641177ca2b3e2d1b31  tools/v62.patch.b64.part07' | sha256sum -c -
          cat tools/v62.patch.b64.part* | base64 -d | gzip -d > /tmp/v62.patch
          echo '5cfbc977d86a057f8c43a4a504e10ff3d12e3b6e61910a04ea824eaa59020dd1  /tmp/v62.patch' | sha256sum -c -
      - name: Commit repaired payload chunk
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/v62.patch.b64.part07; then
            echo 'Payload chunk already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/v62.patch.b64.part07
          git commit -m 'Repair final v62 payload byte'
          git push origin HEAD:${{ github.head_ref }}
