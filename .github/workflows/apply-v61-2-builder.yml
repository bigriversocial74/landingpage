name: Apply North Mountain Media v61.2 Builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-builder:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/landing-page-builder-library-v61-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landing-page-builder-library-v61-2
          fetch-depth: 0

      - name: Reconstruct and apply v61.2 source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .nmm-v612/chunk-00.txt ]]; then
            cat .nmm-v612/chunk-*.txt | base64 -d > /tmp/v612-changes.tgz
            echo '688d7966eabd808aea44fbb8f3559c56599d9dedf76a2049a3fb1d887bd9eb49  /tmp/v612-changes.tgz' | sha256sum -c -
            tar -xzf /tmp/v612-changes.tgz
            rm -rf .nmm-v612
          fi

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php

          python3 <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

          test -f portal/site-builder.php
          test -f portal/site-builder-core.php
          test -f assets/js/site-builder.js
          test -f assets/css/site-builder-admin.css
          test -f assets/css/site-builder-public.css
          test -f LANDING-PAGE-BUILDER-SETUP-v61.2.md
          test -f V61.2-VALIDATION.txt

      - name: Commit v61.2 application source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo 'v61.2 source is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build landing page editor and visual block library v61.2'
          git push origin HEAD:feature/landing-page-builder-library-v61-2
