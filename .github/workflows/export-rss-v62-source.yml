name: Export RSS Reader v62 Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/rss-reader-platform-v62'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git ls-files -z | while IFS= read -r -d '' path; do
            mkdir -p "export/$(dirname "$path")"
            cp -a "$path" "export/$path"
          done
          find export -type f -print | sort > export/TRACKED-FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rss-reader-v62-source
          path: export
