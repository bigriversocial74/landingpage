name: Repair Federated Timeline v66H

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-federated-timeline-v66h.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/federated-timeline-discovery-v66h-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair schema and source contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in ['database/federated_timeline_v66h.sql', 'database/north_mountain_portal.sql']:
              replace_once(
                  path,
                  '    sensitive TINYINT(1) NOT NULL DEFAULT 0,',
                  '    is_sensitive TINYINT(1) NOT NULL DEFAULT 0,',
                  f'{path} reserved column repair',
              )

          replace_once(
              'portal/federated-timeline.php',
              'body_text,body_hash,content_warning,sensitive,language_code,visibility,',
              'body_text,body_hash,content_warning,is_sensitive,language_code,visibility,',
              'timeline insert column repair',
          )
          replace_once(
              'portal/federated-timeline.php',
              'content_warning=VALUES(content_warning),sensitive=VALUES(sensitive),',
              'content_warning=VALUES(content_warning),is_sensitive=VALUES(is_sensitive),',
              'timeline update column repair',
          )

          replace_once(
              'tests/federated-timeline-v66h.php',
              '[\'unsolicited mention quarantine\', "$status = $following ? \'active\' : \'pending\'", $source[\'core\']],',
              '[\'unsolicited mention quarantine\', \'$status = $following ? \\\'active\\\' : \\\'pending\\\'\', $source[\'core\']],',
              'literal quarantine assertion',
          )
          replace_once(
              'tests/federated-timeline-v66h.php',
              '[\'signed Like\', "\'type\' => $type === \'like\' ? \'Like\' : \'Announce\'", $source[\'core\']],',
              '[\'signed Like\', \'\\\'type\\\' => $type === \\\'like\\\' ? \\\'Like\\\' : \\\'Announce\\\'\', $source[\'core\']],',
              'literal signed action assertion',
          )
          PY
          git rm -f tools/apply-federated-timeline-v66h.py
          rm -f .github/workflows/apply-federated-timeline-v66h.yml
      - name: Validate repaired source
        run: |
          set -euo pipefail
          php -l portal/federated-timeline.php
          php -l tests/federated-timeline-v66h.php
          php tests/federated-timeline-v66h.php
          grep -F 'is_sensitive TINYINT(1)' database/federated_timeline_v66h.sql >/dev/null
          grep -F 'is_sensitive TINYINT(1)' database/north_mountain_portal.sql >/dev/null
          if grep -E '(^|[^A-Za-z_])sensitive TINYINT' database/federated_timeline_v66h.sql database/north_mountain_portal.sql; then exit 1; fi
      - name: Commit repaired application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            database/federated_timeline_v66h.sql \
            database/north_mountain_portal.sql \
            portal/federated-timeline.php \
            tests/federated-timeline-v66h.php
          git commit -m 'Repair Federated Timeline schema and regressions'
          git push origin HEAD:${{ github.head_ref }}
