name: POD Social Posts Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply repairs
        run: python3 tools/repair-social-posts-v66p.py
      - name: Validate repairs
        run: |
          php -l portal/social-posts-service.php
          php -l portal/activitypub-service.php
          php tests/activitypub-v66f.php
          php tests/stories-v66o.php
      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/social-posts-service.php portal/activitypub-service.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Social Posts PDO update and public outbox privacy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
