name: Apply Social Posts Navigation v66P

on:
  push:
    branches:
      - feature/pod-social-post-publisher-v66p-20260731
    paths:
      - '.github/workflows/apply-social-posts-navigation-v66p.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pod-social-post-publisher-v66p-20260731
          fetch-depth: 0
      - name: Add permanent navigation route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('portal/bootstrap.php')
          text=path.read_text(encoding='utf-8')
          old="            'blog' => 'Blog',\n            'syndication' => 'Syndication',"
          new="            'blog' => 'Blog',\n            'social-posts' => 'Social Posts',\n            'syndication' => 'Syndication',"
          if new not in text:
              if old not in text: raise SystemExit('Navigation anchor not found.')
              text=text.replace(old,new,1)
          old2="                                    href=\"<?= e(app_url(\n                                        'portal/' . $script .\n                                        ($key === 'dashboard' ? '' : '?view=' . $key)\n                                    )) ?>\""
          new2="                                    href=\"<?= e($key === 'social-posts'\n                                        ? app_url('portal/social-posts.php')\n                                        : app_url(\n                                            'portal/' . $script .\n                                            ($key === 'dashboard' ? '' : '?view=' . $key)\n                                        )) ?>\""
          if new2 not in text:
              if old2 not in text: raise SystemExit('Administrator link anchor not found.')
              text=text.replace(old2,new2,1)
          path.write_text(text,encoding='utf-8')

          page=Path('portal/social-posts.php')
          page_text=page.read_text(encoding='utf-8')
          page_text=page_text.replace("portal_header('Social Posts', 'communications', $user);","portal_header('Social Posts', 'social-posts', $user);",1)
          page.write_text(page_text,encoding='utf-8')
          PY
      - name: Validate PHP
        run: |
          php -l portal/bootstrap.php
          php -l portal/social-posts.php
      - name: Commit navigation integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/bootstrap.php portal/social-posts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Social Posts to administrator navigation'
          git push origin HEAD:feature/pod-social-post-publisher-v66p-20260731
