name: Apply RSS Reader Platform v62

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  certify:
    if: github.head_ref == 'feature/rss-reader-platform-v62'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v62 feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify v62 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v62.patch.b64.part00 \
              tools/v62.patch.b64.part01 \
              tools/v62.patch.b64.part02 \
              tools/v62.patch.b64.part03 \
              tools/v62.patch.b64.part04 \
              tools/v62.patch.b64.part05 \
              tools/v62.patch.b64.part06 \
              tools/v62.patch.b64.part07 \
            | base64 -d | gzip -d > /tmp/v62.patch
          echo '5cfbc977d86a057f8c43a4a504e10ff3d12e3b6e61910a04ea824eaa59020dd1  /tmp/v62.patch' | sha256sum -c -
          if grep -q '^diff --git a/\.github/' /tmp/v62.patch; then
            echo 'Patch must not modify GitHub workflow files.' >&2
            exit 1
          fi
          git show fc754ffc7e20779ecfee914cea310822361d9b22:V62-SCORECARD-DRAFT.md > V62-SCORECARD-DRAFT.md
          git apply --check /tmp/v62.patch
          git apply /tmp/v62.patch
          git diff --check

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -type f -name '*.js' -print0)

      - name: CSS structure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

      - name: Retained portal regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php
          php tests/landing-page-editor-v61-4.php
          php tests/landing-page-editor-v61-5.php
          php tests/landing-page-editor-v61-8.php
          php tests/site-analytics-listening-v61-9.php

      - name: RSS and feed reader v62 certification
        shell: bash
        run: |
          set -euo pipefail
          php tests/rss-feed-reader-v62.php
          test -f blog-feed.php
          test -f blog-atom.php
          test -f portal/blog-feed-output.php
          test -f portal/feed-reader-core.php
          test -f portal/feed-reader-view.php
          test -f portal/feed-reader-api.php
          test -f portal/feed-reader-opml.php
          test -f cron/feed-refresh.php
          test -f database/rss_feed_reader_v62.sql
          test -f assets/css/feed-reader.css
          test -f assets/js/feed-reader.js
          test -f RSS-FEED-READER-SETUP-v62.md
          test -f V62-SCORECARD.md
          test -f V62-VALIDATION.txt
          grep -q '10/10' V62-SCORECARD.md
          grep -q 'feed_sources' database/rss_feed_reader_v62.sql
          grep -q 'CURLOPT_RESOLVE' portal/feed-reader-core.php
          grep -q 'LIBXML_NONET' portal/feed-reader-core.php
          grep -q 'ETag' portal/blog-feed-output.php

      - name: Repository safety
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config.php
          git diff --check
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.lock' \) -print | grep -q .; then
            echo 'Unsafe configuration or runtime file found.' >&2
            exit 1
          fi

      - name: Publish certified production commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/**' ':!tools/**'
          git diff --cached --check
          git commit -m 'Build RSS and feed reader platform v62'
          git push --force origin HEAD:generated/rss-reader-platform-v62
