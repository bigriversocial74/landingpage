name: Policy Finalize Automation Rules v66K

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/policy-finalize-automation-rules-v66k.yml'
      - 'tools/policy-finalize-automation-rules-v66k.py'

permissions:
  contents: write

jobs:
  policy-finalize:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply complete policy finalization
        run: |
          set -euo pipefail
          python3 tools/policy-finalize-automation-rules-v66k.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mbstring
      - name: Validate policy-complete source
        run: |
          set -euo pipefail
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
          grep -F "array_replace(\$settings, ['enabled' => false])" portal/automation-admin.php >/dev/null
          ! grep -F 'DELETE FROM automation_rules' portal/automation-admin.php
          grep -F "(\$evidence['matched'] ?? null) === true" portal/automation-rules.php >/dev/null
          grep -F 'automation_expire_rules' portal/automation-rules.php >/dev/null
          grep -F 'automation_retry_approval' portal/automation-rules.php >/dev/null
          grep -F 'automation_notify_owner' portal/automation-rules.php >/dev/null
          grep -F 'Global dry-run must not consume live rule limits.' tests/automation-rules-db-v66k.php >/dev/null
      - name: Commit policy-complete application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Finalize Automation Rules v66K policy and audit safety'
          git push origin HEAD:${{ github.head_ref }}
