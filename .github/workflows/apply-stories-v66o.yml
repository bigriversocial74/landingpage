name: Apply Stories v66O integration

on:
  push:
    branches:
      - feature/stories-followed-feed-v66o-20260731
    paths:
      - 'tools/stories-v66o.payload.*'
      - 'tools/apply-stories-v66o.py'
      - '.github/workflows/apply-stories-v66o.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/stories-v66o.payload.*'
      - 'tools/apply-stories-v66o.py'
      - '.github/workflows/apply-stories-v66o.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stories-followed-feed-v66o-20260731
      - name: Extract and integrate permanent source
        run: python3 tools/apply-stories-v66o.py
      - name: Validate generated source
        run: |
          set -euo pipefail
          for file in \
            portal/activitypub-service.php portal/federated-feed.php \
            portal/stories-service.php portal/stories.php api/story-view.php \
            activitypub-story.php cron/process-stories.php \
            tests/stories-v66o.php tests/stories-db-v66o.php; do
              php -l "$file"
          done
          php tests/stories-v66o.php
          node --check assets/js/stories-v66o.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('assets/css/stories-v66o.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('Unbalanced Stories CSS braces.')
          print('Stories CSS structure passed.')
          PY
      - name: Commit permanent Stories source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            database/stories_v66o.sql database/north_mountain_portal_v66o.sql \
            portal/stories-service.php portal/stories.php portal/activitypub-service.php \
            portal/federated-feed.php api/story-view.php activitypub-story.php \
            cron/process-stories.php assets/css/stories-v66o.css \
            assets/js/stories-v66o.js tests/stories-v66o.php \
            tests/stories-db-v66o.php .github/workflows/stories-quality.yml \
            STORIES-SETUP-v66O.md V66O-SCORECARD.md V66O-VALIDATION.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build follower Stories module v66O'
          git push origin HEAD:feature/stories-followed-feed-v66o-20260731
