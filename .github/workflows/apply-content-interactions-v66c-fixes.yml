name: Apply Content Interactions v66C Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - tools/fix-content-interactions-v66c.py
      - tools/normalize-content-interactions-v66c-fixes.py
      - .github/workflows/apply-content-interactions-v66c-fixes.yml

permissions:
  contents: write

concurrency:
  group: content-interactions-v66c-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/content-interactions-v66c-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize hardening patch
        run: python3 tools/normalize-content-interactions-v66c-fixes.py

      - name: Apply hardening fixes
        run: python3 tools/fix-content-interactions-v66c.py

      - name: Add edit-policy runtime assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/content-interactions-v66c.php')
          lines = path.read_text(encoding='utf-8').splitlines()
          insert_at = next((i + 1 for i, line in enumerate(lines) if 'Administrator edit override failed.' in line), None)
          if insert_at is None:
              raise SystemExit('Unable to locate administrator edit assertion.')
          additions = [
              "if (content_interactions_can_edit(['author_user_id'=>7,'status'=>'hidden','created_at'=>$now], ['id'=>7,'role'=>'client'])) { fwrite(STDERR, \"Hidden comment edit bypass detected.\\n\"); exit(1); }",
              "if (content_interactions_can_edit(['author_user_id'=>7,'status'=>'spam','created_at'=>$now], ['id'=>7,'role'=>'client'])) { fwrite(STDERR, \"Spam comment edit bypass detected.\\n\"); exit(1); }",
          ]
          lines[insert_at:insert_at] = additions
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          php -l portal/content-interactions.php
          php -l content-interactions-api.php
          php -l tests/content-interactions-v66c.php
          node --check assets/js/content-interactions.js
          node --check tests/content-interactions-v66c.js
          php tests/content-interactions-v66c.php
          node tests/content-interactions-v66c.js

      - name: Commit hardening fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix-content-interactions-v66c.py tools/normalize-content-interactions-v66c-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Content Interactions v66C"
          git push origin HEAD:${{ github.head_ref }}
