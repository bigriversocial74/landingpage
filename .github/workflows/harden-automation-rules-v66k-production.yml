name: Harden Automation Rules v66K Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harden-automation-rules-v66k-production.yml'
      - 'tools/harden-automation-rules-v66k-production-v5.py'

permissions:
  contents: write

jobs:
  harden-production:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-final-20260730'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final production hardening
        run: |
          set -euo pipefail
          python3 tools/harden-automation-rules-v66k-production-v5.py
      - name: Install PHP when absent
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null; then brew install php; fi
      - name: Validate hardened source
        run: |
          set -euo pipefail
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
          grep -F 'automation_refresh_execution_status' portal/automation-rules.php >/dev/null
          grep -F 'automation_retry_approval' portal/automation-rules.php >/dev/null
          grep -F 'automation_notify_owner' portal/automation-rules.php >/dev/null
          grep -F "(\$evidence['matched'] ?? null) === true" portal/automation-rules.php >/dev/null
          grep -F 'CREATE TABLE IF NOT EXISTS automation_settings' database/north_mountain_portal.sql >/dev/null
          grep -F 'FOREIGN KEY (event_id) REFERENCES automation_events(id) ON DELETE SET NULL' database/automation_rules_v66k.sql >/dev/null
          grep -F "array_replace(\$settings, ['enabled' => false])" portal/automation-admin.php >/dev/null
          ! grep -F 'DELETE FROM automation_rules' portal/automation-admin.php
          grep -F 'A nonmatching simulation must not authorize rule activation.' tests/automation-rules-db-v66k.php >/dev/null
          grep -F 'Action receipts must survive the shorter event-retention window.' tests/automation-rules-db-v66k.php >/dev/null
      - name: Commit production hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            database/automation_rules_v66k.sql \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Harden Automation Rules v66K production policy'
          git push origin HEAD:${{ github.head_ref }}
