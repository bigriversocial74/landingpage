name: Harden Federated Messaging v66I

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harden-federated-messaging-v66i.yml'
      - 'tools/harden-federated-messaging-v66i.py'

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feature/federated-messaging-homeserver-v66i-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply safety and lifecycle hardening
        run: |
          set -euo pipefail
          python3 tools/harden-federated-messaging-v66i.py
      - name: Validate hardened source
        run: |
          set -euo pipefail
          php -l portal/federated-messaging.php
          php -l portal/federated-messages.php
          php -l tests/federated-messaging-v66i.php
          php -l tests/federated-messaging-db-v66i.php
          php tests/federated-messaging-v66i.php
          grep -F 'federated_messaging_domain_hour_count' portal/federated-messaging.php >/dev/null
          grep -F 'federated_messaging_mark_unread' portal/federated-messaging.php >/dev/null
          grep -F "'thread_reported'" portal/federated-messaging.php >/dev/null
          grep -F "'delete_local'" portal/federated-messaging.php >/dev/null
          grep -F "['draft','translate']" portal/federated-messages.php >/dev/null
      - name: Commit hardened application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/federated-messaging.php portal/federated-messages.php \
            tests/federated-messaging-v66i.php tests/federated-messaging-db-v66i.php
          git commit -m 'Harden Federated Messaging safety and lifecycle v66I'
          git push origin HEAD:${{ github.head_ref }}
