name: Finalize Automation Rules v66K

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-automation-rules-v66k.yml'
      - 'tools/finalize-automation-rules-v66k.py'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply integration and final hardening
        run: |
          set -euo pipefail
          python3 tools/finalize-automation-rules-v66k.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mbstring
      - name: Validate final source
        run: |
          set -euo pipefail
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
          grep -F "require_once __DIR__ . '/automation-admin.php';" portal/admin.php >/dev/null
          grep -F 'automation_capture_notification($notificationId)' portal/notifications.php >/dev/null
          grep -F "'status' => 'idempotent'" portal/automation-rules.php >/dev/null
          grep -F 'automation_refresh_execution_status' portal/automation-rules.php >/dev/null
          grep -F 'automation_retry_approval' portal/automation-rules.php >/dev/null
          grep -F 'automation_notify_owner' portal/automation-rules.php >/dev/null
          grep -F 'tool_execution_allowed' portal/automation-rules.php >/dev/null
          grep -F 'automation_retry_approval' portal/automation-admin.php >/dev/null
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS automation_rules' database/north_mountain_portal.sql)" = "1"
      - name: Commit integrated and hardened application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Integrate and harden Automation Rules v66K'
          git push origin HEAD:${{ github.head_ref }}
