name: Apply Social Posts v66P Integration

on:
  push:
    branches:
      - feature/pod-social-post-publisher-v66p-20260731
    paths:
      - '.github/workflows/apply-social-posts-v66p.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pod-social-post-publisher-v66p-20260731
          fetch-depth: 0

      - name: Patch permanent integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old[:120]}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'landing-page.php',
              "require_once __DIR__ . '/portal/music-library.php';",
              "require_once __DIR__ . '/portal/music-library.php';\nrequire_once __DIR__ . '/portal/activitypub-service.php';\nrequire_once __DIR__ . '/portal/social-posts-service.php';"
          )
          replace_once(
              'landing-page.php',
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/landing-page.css?v=20260727-visual-site-builder-v61'))?>\">",
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/landing-page.css?v=20260727-visual-site-builder-v61'))?>\">\n<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/social-posts-v66p.css?v=20260731-v66P'))?>\">"
          )
          replace_once(
              'landing-page.php',
              '<section class="landing-final-cta">',
              '<?php social_posts_render_landing();?>\n<section class="landing-final-cta">'
          )
          replace_once(
              'landing-page.php',
              "<script src=\"<?=e(app_url('assets/js/landing-page.js?v=20260727-visual-site-builder-v61'))?>\"></script>",
              "<script src=\"<?=e(app_url('assets/js/social-posts-v66p.js?v=20260731-v66P'))?>\"></script>\n<script src=\"<?=e(app_url('assets/js/landing-page.js?v=20260727-visual-site-builder-v61'))?>\"></script>"
          )

          replace_once(
              'portal/site-builder-core.php',
              "function site_builder_render_page(array $page,array $payload,bool $preview=false): void\n{\n    $payload=site_builder_resolve_global_sections($payload);",
              "function site_builder_render_page(array $page,array $payload,bool $preview=false): void\n{\n    require_once __DIR__.'/activitypub-service.php';\n    require_once __DIR__.'/social-posts-service.php';\n    $payload=site_builder_resolve_global_sections($payload);"
          )
          replace_once(
              'portal/site-builder-core.php',
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/site-builder-public.css?v=20260727-v61.8'))?>\"><link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/music-library.css?v=20260727-v61'))?>\">",
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/site-builder-public.css?v=20260727-v61.8'))?>\"><link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/music-library.css?v=20260727-v61'))?>\"><link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/social-posts-v66p.css?v=20260731-v66P'))?>\">"
          )
          replace_once(
              'portal/site-builder-core.php',
              "<main><?php foreach($payload['sections']??[] as $section) echo site_builder_render_section($section);?></main><footer",
              "<main><?php foreach($payload['sections']??[] as $section) echo site_builder_render_section($section);?><?php if(!$preview&&(string)($page['slug']??'')==='home'&&function_exists('social_posts_render_landing'))social_posts_render_landing();?></main><footer"
          )
          replace_once(
              'portal/site-builder-core.php',
              "<script src=\"<?=e(app_url('assets/js/site-public.js?v=20260727-v61.8'))?>\"></script><script src=\"<?=e(app_url('assets/js/music-player.js?v=20260727-v61'))?>\"></script></body></html>",
              "<script src=\"<?=e(app_url('assets/js/site-public.js?v=20260727-v61.8'))?>\"></script><script src=\"<?=e(app_url('assets/js/music-player.js?v=20260727-v61'))?>\"></script><script src=\"<?=e(app_url('assets/js/social-posts-v66p.js?v=20260731-v66P'))?>\"></script></body></html>"
          )

          replace_once(
              'portal/federated-feed.php',
              "require_once __DIR__ . '/activitypub-service.php';\nrequire_once __DIR__ . '/federated-timeline.php';",
              "require_once __DIR__ . '/activitypub-service.php';\nrequire_once __DIR__ . '/social-posts-service.php';\nrequire_once __DIR__ . '/federated-timeline.php';"
          )
          replace_once(
              'portal/federated-feed.php',
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/stories-v66o.css?v=20260731-v66O'))?>\">",
              "<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/stories-v66o.css?v=20260731-v66O'))?>\">\n<link rel=\"stylesheet\" href=\"<?=e(app_url('assets/css/social-posts-v66p.css?v=20260731-v66P'))?>\">"
          )
          replace_once(
              'portal/federated-feed.php',
              '<?php stories_render_rail($userId,24);?>',
              '<?php stories_render_rail($userId,24);?>\n<?php social_posts_render_portal_stream($userId,8);?>'
          )
          PY

      - name: Validate patched PHP and JavaScript
        run: |
          set -euo pipefail
          for file in \
            landing-page.php portal/site-builder-core.php portal/federated-feed.php \
            portal/social-posts-service.php portal/social-posts.php \
            activitypub-social-post.php social-post.php social-feed.php follow-pod.php; do
              php -l "$file"
          done
          node --check assets/js/social-posts-v66p.js

      - name: Commit permanent integrations
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No integration changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing-page.php portal/site-builder-core.php portal/federated-feed.php
          git commit -m 'Integrate POD social posts with landing pages and timeline'
          git push origin HEAD:feature/pod-social-post-publisher-v66p-20260731
