name: Repair v66K Certification

on:
  push:
    branches:
      - feature/automation-routing-action-center-v66k-certified-20260730
    paths:
      - '.github/workflows/repair-v66k-certification.yml'

permissions:
  contents: write

concurrency:
  group: repair-v66k-certification
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automation-routing-action-center-v66k-certified-20260730
          fetch-depth: 0

      - name: Repair exact certification failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('portal/automation-rules.php')
          core = core_path.read_text(encoding='utf-8')

          old_sql = ':starts_at,:expires_at,:user_id,:user_id)'
          new_sql = ':starts_at,:expires_at,:created_by_user_id,:updated_by_user_id)'
          if core.count(old_sql) != 1:
              raise SystemExit(f'Expected one duplicated insert placeholder sequence, found {core.count(old_sql)}')
          core = core.replace(old_sql, new_sql, 1)

          old_execute = "$statement->execute($clean + ['rule_uuid' => automation_uuid(), 'user_id' => $userId]);"
          new_execute = """$statement->execute($clean + [
                'rule_uuid' => automation_uuid(),
                'created_by_user_id' => $userId,
                'updated_by_user_id' => $userId,
            ]);"""
          if core.count(old_execute) != 1:
              raise SystemExit(f'Expected one duplicated insert binding statement, found {core.count(old_execute)}')
          core = core.replace(old_execute, new_execute, 1)
          core_path.write_text(core, encoding='utf-8')

          test_path = Path('tests/automation-rules-v66k.php')
          test = test_path.read_text(encoding='utf-8')
          old_assertion = 'v66k_assert(str_contains($admin, "array_replace($settings, [\'enabled\' => false])"), \'Emergency disable must replace the enabled setting.\');'
          new_assertion = 'v66k_assert(str_contains($admin, "array_replace(\\$settings, [\'enabled\' => false])"), \'Emergency disable must replace the enabled setting.\');'
          if test.count(old_assertion) != 1:
              raise SystemExit(f'Expected one interpolating emergency-disable assertion, found {test.count(old_assertion)}')
          test = test.replace(old_assertion, new_assertion, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate repaired source
        run: |
          set -euo pipefail
          php -l portal/automation-rules.php
          php -l tests/automation-rules-v66k.php
          php tests/automation-rules-v66k.php
          grep -F ':created_by_user_id,:updated_by_user_id)' portal/automation-rules.php >/dev/null
          grep -F "'created_by_user_id' => \$userId" portal/automation-rules.php >/dev/null
          grep -F 'array_replace(\$settings' tests/automation-rules-v66k.php >/dev/null

      - name: Remove repair controller and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-v66k-certification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/automation-rules.php tests/automation-rules-v66k.php .github/workflows/repair-v66k-certification.yml
          git commit -m "Repair v66K source and database certification failures"
          git push origin HEAD:feature/automation-routing-action-center-v66k-certified-20260730
