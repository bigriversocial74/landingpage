name: Repair My Feed and Agent Integration v66Q.3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply portal navigation, My Feed, and Agent integration repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source contract not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          bootstrap = Path('portal/bootstrap.php')
          text = bootstrap.read_text()

          # Remove the standalone Notifications navigation link from the client navigation.
          old = "            'notifications' => 'Notifications',\n"
          if old not in text:
              raise SystemExit('Client Notifications navigation entry was not found.')
          text = text.replace(old, '', 1)

          old_groups = """        'Operations' => [
            'agent' => 'Agent Chat',
            'dashboard' => 'Dashboard',
            'inbox' => 'Unified Inbox',
            'social-posts' => 'My Feed',
            'music' => 'Music Library',
            'analytics' => 'Visitor Intelligence',
            'site-analytics' => 'Site Analytics',
            'call-center' => 'Call Center',
            'communications' => 'Communications',
            'notifications' => 'Notifications',
        ],
        'Relationships' => [
            'clients' => 'Clients',
            'crm' => 'CRM',
            'leads' => 'Leads',
            'administrators' => 'Administrators',
        ],
        'Work' => [
            'portfolio' => 'Portfolio',
            'blog' => 'Blog',
            'syndication' => 'Syndication',
            'federation' => 'Federation',
            'feeds' => 'Feed Reader',
            'events' => 'Events',
            'bookings' => 'Bookings',
            'proposals' => 'Proposals',
            'resume' => 'Resume Posts',
            'projects' => 'Client Projects',
            'files' => 'Files',
            'knowledge' => 'Knowledge Base',
            'builder' => 'Page Editor',
            'menus' => 'Navigation',
        ],
        'System' => [
            'settings' => 'Settings',
            'account' => 'Account',
        ],
"""
          new_groups = """        'Operations' => [
            'agent' => 'Agent Chat',
            'dashboard' => 'Dashboard',
            'social-posts' => 'My Feed',
            'music' => 'Music Library',
            'call-center' => 'Call Center',
            'communications' => 'Communications',
        ],
        'Relationships' => [
            'inbox' => 'Unified Inbox',
            'clients' => 'Clients',
            'crm' => 'CRM',
            'leads' => 'Leads',
            'administrators' => 'Administrators',
        ],
        'Work' => [
            'portfolio' => 'Portfolio',
            'blog' => 'Blog',
            'syndication' => 'Syndication',
            'federation' => 'Federation',
            'feeds' => 'Feed Reader',
            'events' => 'Events',
            'bookings' => 'Bookings',
            'proposals' => 'Proposals',
            'resume' => 'Resume Posts',
            'projects' => 'Client Projects',
            'files' => 'Files',
            'knowledge' => 'Knowledge Base',
            'builder' => 'Page Editor',
            'menus' => 'Navigation',
        ],
        'System' => [
            'analytics' => 'Visitor Intelligence',
            'site-analytics' => 'Site Analytics',
            'settings' => 'Settings',
            'account' => 'Account',
        ],
"""
          if old_groups not in text:
              raise SystemExit('Administrator navigation group contract was not found.')
          text = text.replace(old_groups, new_groups, 1)

          old_clients_map = """            'clients' => [
                ['Relationships','clients'],
                ['Work','projects'],
                ['Work','files'],
            ],
"""
          new_clients_map = """            'clients' => [
                ['Relationships','clients'],
                ['Operations','communications'],
                ['Work','projects'],
                ['Work','files'],
            ],
"""
          if old_clients_map not in text:
              raise SystemExit('Clients module navigation map was not found.')
          text = text.replace(old_clients_map, new_clients_map, 1)

          old_client_disable = """        if (!nmm_module_enabled('clients')) {
            unset($navigation['projects'], $navigation['files']);
        }
"""
          new_client_disable = """        if (!nmm_module_enabled('clients')) {
            unset(
                $navigation['projects'],
                $navigation['files'],
                $navigation['communications']
            );
        }
"""
          if old_client_disable not in text:
              raise SystemExit('Client module visibility contract was not found.')
          text = text.replace(old_client_disable, new_client_disable, 1)

          old_notification_footer = """                        <footer>
                            <a href=\"<?= e($messagesUrl) ?>\">Communications</a>
                            <a href=\"<?= e($callCenterUrl) ?>\"><?= $isAdmin ? 'Open Call Center' : 'Call Us' ?></a>
                        </footer>
"""
          new_notification_footer = """                        <footer>
                            <?php if (nmm_module_enabled('clients')): ?>
                                <a href=\"<?= e($messagesUrl) ?>\">Communications</a>
                            <?php endif; ?>
                            <a href=\"<?= e($callCenterUrl) ?>\"><?= $isAdmin ? 'Open Call Center' : 'Call Us' ?></a>
                        </footer>
"""
          if old_notification_footer not in text:
              raise SystemExit('Notification menu footer contract was not found.')
          text = text.replace(old_notification_footer, new_notification_footer, 1)

          quick_communications = """                                <button type=\"button\" data-admin-quick-prompt=\"Unread communications\"><strong>Communications</strong><small>Show unread conversations</small></button>
"""
          wrapped_quick_communications = """                                <?php if (nmm_module_enabled('clients')): ?>
                                    <button type=\"button\" data-admin-quick-prompt=\"Unread communications\"><strong>Communications</strong><small>Show unread conversations</small></button>
                                <?php endif; ?>
"""
          if quick_communications not in text:
              raise SystemExit('Assistant Communications query action was not found.')
          text = text.replace(quick_communications, wrapped_quick_communications, 1)

          action_communications = """                                <a href=\"<?= e(app_url('portal/admin.php?view=communications')) ?>\"><span>Open</span><strong>Communications</strong><small>Messages and active conversations</small></a>
"""
          wrapped_action_communications = """                                <?php if (nmm_module_enabled('clients')): ?>
                                    <a href=\"<?= e(app_url('portal/admin.php?view=communications')) ?>\"><span>Open</span><strong>Communications</strong><small>Messages and active conversations</small></a>
                                <?php endif; ?>
"""
          if action_communications not in text:
              raise SystemExit('Assistant Communications launcher action was not found.')
          text = text.replace(action_communications, wrapped_action_communications, 1)

          old_chat_section = """            <section
                class=\"admin-assistant-chat\"
                data-admin-assistant-chat
                aria-label=\"North Mountain administrator assistant\"
                hidden
            >
"""
          new_chat_section = """            <section
                class=\"admin-assistant-chat<?= $active === 'agent' ? ' admin-assistant-chat-integrated' : '' ?>\"
                data-admin-assistant-chat
                aria-label=\"North Mountain administrator assistant\"
                <?= $active === 'agent' ? '' : 'hidden' ?>
            >
"""
          if old_chat_section not in text:
              raise SystemExit('Administrator assistant chat shell was not found.')
          text = text.replace(old_chat_section, new_chat_section, 1)

          text = text.replace(
              'assets/css/portal.css?v=20260728-content-controls-v62.1',
              'assets/css/portal.css?v=20260731-agent-feed-integration-v66Q3',
              1,
          )
          text = text.replace(
              'assets/js/portal.js?v=20260728-content-controls-v62.1',
              'assets/js/portal.js?v=20260731-agent-feed-integration-v66Q3',
              1,
          )
          text = text.replace(
              'assets/js/publishing-center-v66q.js?v=20260731-v66Q',
              'assets/js/publishing-center-v66q.js?v=20260731-v66Q3',
              1,
          )
          bootstrap.write_text(text)

          # Integrate the dedicated Agent page with the existing sticky-footer assistant.
          portal_js = Path('assets/js/portal.js')
          text = portal_js.read_text()
          anchor = "let adminLauncherActiveTab = 'queries';\n"
          if anchor not in text:
              raise SystemExit('Assistant state anchor was not found in portal.js.')
          text = text.replace(
              anchor,
              anchor + "const adminAssistantIntegrated =\n  document.body.dataset.portalActive === 'agent';\n",
              1,
          )

          old_open = """const openAdminChat = () => {
  if (!adminAssistantChat) return;
  adminAssistantChat.hidden = false;
  document.body.classList.add('admin-assistant-active');
};
"""
          new_open = """const openAdminChat = () => {
  if (!adminAssistantChat) return;
  adminAssistantChat.hidden = false;
  if (!adminAssistantIntegrated) {
    document.body.classList.add('admin-assistant-active');
  }
};
"""
          if old_open not in text:
              raise SystemExit('openAdminChat contract was not found.')
          text = text.replace(old_open, new_open, 1)

          old_close = """const closeAdminChat = () => {
  if (adminAssistantChat) {
    adminAssistantChat.hidden = true;
  }

  if (adminAssistantLoading) {
    adminAssistantLoading.hidden = true;
  }

  document.body.classList.remove(
    'admin-assistant-active',
    'admin-assistant-querying'
  );
  closeAdminQuickMenu();
};
"""
          new_close = """const closeAdminChat = () => {
  if (adminAssistantChat) {
    adminAssistantChat.hidden = !adminAssistantIntegrated;
  }

  if (adminAssistantLoading) {
    adminAssistantLoading.hidden = true;
  }

  document.body.classList.remove(
    'admin-assistant-active',
    'admin-assistant-querying'
  );
  closeAdminQuickMenu();
};
"""
          if old_close not in text:
              raise SystemExit('closeAdminChat contract was not found.')
          text = text.replace(old_close, new_close, 1)

          old_clear = """const clearAdminChat = () => {
  adminAssistantMessages?.replaceChildren();
  closeAdminChat();

  if (adminAssistantInput) {
    adminAssistantInput.value = '';
    adminAssistantInput.style.height = '';
    adminAssistantInput.focus();
  }
};
"""
          new_clear = """const clearAdminChat = () => {
  adminAssistantMessages?.replaceChildren();
  closeAdminChat();

  if (adminAssistantInput) {
    adminAssistantInput.value = '';
    adminAssistantInput.style.height = '';
    adminAssistantInput.focus();
  }
};
"""
          if old_clear not in text:
              raise SystemExit('clearAdminChat contract was not found.')
          text = text.replace(old_clear, new_clear, 1)

          old_auto = """if (document.body.dataset.portalActive === 'agent') {
  window.requestAnimationFrame(openAdminChat);
}
"""
          new_auto = """if (adminAssistantIntegrated && adminAssistantChat) {
  adminAssistantChat.hidden = false;
}
"""
          if old_auto not in text:
              raise SystemExit('Agent overlay auto-open contract was not found.')
          text = text.replace(old_auto, new_auto, 1)
          portal_js.write_text(text)

          # Make the integrated Agent conversation and loader part of normal page flow.
          portal_css = Path('assets/css/portal.css')
          css = portal_css.read_text()
          marker = '/* v66Q.3 integrated Agent Chat */'
          if marker not in css:
              css += r'''

/* v66Q.3 integrated Agent Chat */
.portal-body[data-portal-active="agent"] .portal-content {
  padding-bottom: 24px;
}
.portal-body[data-portal-active="agent"] .admin-assistant-loading {
  position: relative;
  inset: auto;
  z-index: 1;
  width: auto;
  margin: 0 32px 12px;
  border: 1px solid #dfe7ea;
  border-radius: 16px;
  box-shadow: none;
}
.portal-body[data-portal-active="agent"] .admin-assistant-chat {
  position: relative;
  inset: auto;
  z-index: 1;
  display: grid;
  min-height: 360px;
  max-height: none;
  margin: 0 32px 118px;
  border: 1px solid #dfe7ea;
  border-radius: 18px;
  background: rgba(247,250,251,.98);
  box-shadow: 0 18px 45px rgba(27,45,58,.08);
  overflow: hidden;
}
.portal-body[data-portal-active="agent"] .admin-assistant-chat > header {
  display: none;
}
.portal-body[data-portal-active="agent"] .admin-assistant-messages {
  min-height: 360px;
  max-height: calc(100vh - 300px);
  padding-bottom: 44px;
}
.portal-body[data-portal-active="agent"] .admin-assistant-messages:empty::before {
  content: 'Ask the agent a question or choose a suggested prompt above.';
  display: grid;
  min-height: 300px;
  place-items: center;
  padding: 28px;
  color: #71808c;
  font-size: .86rem;
  text-align: center;
}
@media (max-width: 780px) {
  .portal-body[data-portal-active="agent"] .admin-assistant-loading,
  .portal-body[data-portal-active="agent"] .admin-assistant-chat {
    margin-left: 12px;
    margin-right: 12px;
  }
  .portal-body[data-portal-active="agent"] .admin-assistant-chat {
    margin-bottom: 110px;
    border-radius: 14px;
  }
}
'''
          portal_css.write_text(css)

          # Normalize Publishing + targets inside the permanent global runtime.
          publishing_js = Path('assets/js/publishing-center-v66q.js')
          text = publishing_js.read_text()
          old_origin = """    if (target.origin !== window.location.origin) return;

    setOptionState(option);
"""
          new_origin = """    if (target.origin !== window.location.origin) {
      target = new URL(
        `${target.pathname}${target.search}${target.hash}`,
        window.location.origin
      );
    }

    setOptionState(option);
"""
          if old_origin not in text:
              raise SystemExit('Publishing origin rejection contract was not found.')
          text = text.replace(old_origin, new_origin, 1)
          publishing_js.write_text(text)

          # The v66Q.2 shim is superseded by the permanent global runtime.
          publishing_php = Path('portal/publishing-center.php')
          text = publishing_php.read_text()
          old_shim = "<script src=\"<?=e(app_url('assets/js/publishing-agent-runtime-v66q2.js?v=20260731-v66Q2'))?>\"></script>\n"
          if old_shim not in text:
              raise SystemExit('v66Q.2 runtime shim include was not found.')
          publishing_php.write_text(text.replace(old_shim, '', 1))

          # Remove the My Feed title/toolbar/guidance while retaining Stories and the Social Feed.
          social = Path('portal/social-posts.php')
          text = social.read_text()
          old_top = """<div class=\"social-feed-toolbar\">
<div><span>@<?=e(activitypub_account())?></span><strong>Posts and Stories</strong></div>
<div><?php if(nmm_module_enabled('stories')):?><button type=\"button\" data-publishing-open=\"story\">Add story</button><?php endif;?><button type=\"button\" data-publishing-open=\"social-post\">Create post</button><button type=\"button\" data-feed-settings-open aria-label=\"Open Social Feed settings\">Settings</button><a href=\"<?=e(app_url('social-feed.php'))?>\" target=\"_blank\" rel=\"noopener\">Public feed</a></div>
</div>
<p class=\"social-feed-guidance\">Create a post with Publishing +, publish immediately, or choose <strong>Save draft</strong> for later. Blog and RSS remain independent from the Social Feed.</p>

"""
          if old_top not in text:
              raise SystemExit('My Feed top toolbar contract was not found.')
          text = text.replace(old_top, '', 1)
          text = text.replace(
              'assets/css/social-posts-v66p.css?v=20260731-v66P',
              'assets/css/social-posts-v66p.css?v=20260731-v66Q3',
              1,
          )
          text = text.replace(
              'assets/css/stories-v66o.css?v=20260731-v66O',
              'assets/css/stories-v66o.css?v=20260731-v66Q3',
              1,
          )
          text = text.replace(
              'assets/js/social-posts-v66p.js?v=20260731-v66P',
              'assets/js/social-posts-v66p.js?v=20260731-v66Q3',
              1,
          )
          text = text.replace(
              'assets/js/stories-v66o.js?v=20260731-v66O',
              'assets/js/stories-v66o.js?v=20260731-v66Q3',
              1,
          )
          social.write_text(text)

          test = Path('tests/my-feed-agent-navigation-v66q3.php')
          test.write_text(r'''<?php
declare(strict_types=1);

function contract_fail(string $message): never
{
    fwrite(STDERR, "v66Q.3 contract failure: {$message}\n");
    exit(1);
}

$bootstrap = file_get_contents(__DIR__ . '/../portal/bootstrap.php');
$portalJs = file_get_contents(__DIR__ . '/../assets/js/portal.js');
$portalCss = file_get_contents(__DIR__ . '/../assets/css/portal.css');
$publishingJs = file_get_contents(__DIR__ . '/../assets/js/publishing-center-v66q.js');
$publishingPhp = file_get_contents(__DIR__ . '/../portal/publishing-center.php');
$social = file_get_contents(__DIR__ . '/../portal/social-posts.php');

foreach ([
    'bootstrap' => $bootstrap,
    'portalJs' => $portalJs,
    'portalCss' => $portalCss,
    'publishingJs' => $publishingJs,
    'publishingPhp' => $publishingPhp,
    'social' => $social,
] as $name => $source) {
    if (!is_string($source) || $source === '') contract_fail("Unable to read {$name} source.");
}

if (!str_contains($bootstrap, "'Relationships' => [\n            'inbox' => 'Unified Inbox'")) {
    contract_fail('Unified Inbox is not in Relationships.');
}
if (!str_contains($bootstrap, "'System' => [\n            'analytics' => 'Visitor Intelligence',\n            'site-analytics' => 'Site Analytics'")) {
    contract_fail('Analytics links are not in System.');
}
if (str_contains($bootstrap, "'notifications' => 'Notifications'")) {
    contract_fail('Notifications navigation link remains.');
}
if (!str_contains($bootstrap, "['Operations','communications']")) {
    contract_fail('Communications is not controlled by the Clients module.');
}
if (!str_contains($bootstrap, "admin-assistant-chat-integrated")) {
    contract_fail('Integrated Agent chat shell is missing.');
}
if (!str_contains($portalJs, "const adminAssistantIntegrated")) {
    contract_fail('Integrated Agent runtime state is missing.');
}
if (str_contains($portalJs, "window.requestAnimationFrame(openAdminChat)")) {
    contract_fail('Legacy Agent overlay auto-open remains.');
}
if (!str_contains($portalCss, 'v66Q.3 integrated Agent Chat')) {
    contract_fail('Integrated Agent page styles are missing.');
}
if (!str_contains($publishingJs, '`${target.pathname}${target.search}${target.hash}`')) {
    contract_fail('Publishing targets are not normalized to the active origin.');
}
if (str_contains($publishingPhp, 'publishing-agent-runtime-v66q2.js')) {
    contract_fail('Superseded v66Q.2 runtime shim remains loaded.');
}
if (str_contains($social, 'social-feed-toolbar') || str_contains($social, 'social-feed-guidance')) {
    contract_fail('My Feed top copy and toolbar remain.');
}
if (!str_contains($social, 'social-feed-stories') || !str_contains($social, 'social-feed-column')) {
    contract_fail('Stories or Social Feed content was removed.');
}
if (!str_contains($bootstrap, '20260731-agent-feed-integration-v66Q3')) {
    contract_fail('Portal asset cache version was not bumped.');
}

echo "v66Q.3 My Feed, Agent, and navigation contract passed.\n";
''')
          PY

      - name: Validate repaired source
        run: |
          php -l portal/bootstrap.php
          php -l portal/social-posts.php
          php -l portal/publishing-center.php
          php -l tests/my-feed-agent-navigation-v66q3.php
          node --check assets/js/portal.js
          node --check assets/js/publishing-center-v66q.js
          php tests/my-feed-agent-navigation-v66q3.php
          test ! -f tests/publishing-center-v66q.php || php tests/publishing-center-v66q.php
          test ! -f tests/publishing-agent-repair-v66q1.php || php tests/publishing-agent-repair-v66q1.php
          test ! -f tests/publishing-agent-runtime-v66q2.php || php tests/publishing-agent-runtime-v66q2.php
          test ! -f tests/social-posts-v66p.php || php tests/social-posts-v66p.php

      - name: Commit permanent repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/bootstrap.php portal/social-posts.php portal/publishing-center.php \
            assets/js/portal.js assets/js/publishing-center-v66q.js assets/css/portal.css \
            tests/my-feed-agent-navigation-v66q3.php
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "Integrate Agent chat and repair My Feed v66Q.3"
          git push origin HEAD:${{ github.head_ref }}
