name: Export Content Delete Audit v62.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/content-delete-controls-v62-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package relevant source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for path in portal assets api cron database tests *.php config-example.php .github/workflows/portal-quality.yml; do
            for match in $path; do
              if [ -e "$match" ]; then
                mkdir -p "audit/$(dirname "$match")"
                cp -R "$match" "audit/$match"
              fi
            done
          done
          find audit -type f -print | sort > audit/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-delete-audit-v62-1
          path: audit
