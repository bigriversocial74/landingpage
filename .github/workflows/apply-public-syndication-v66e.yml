name: Apply Public Syndication v66E

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-public-syndication-v66e.py
      - .github/workflows/apply-public-syndication-v66e.yml

permissions:
  contents: write

concurrency:
  group: public-syndication-v66e
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/public-syndication-feed-discovery-v66e-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic integration
        run: python3 tools/apply-public-syndication-v66e.py
      - name: Focused validation
        run: |
          set -euo pipefail
          php -l portal/public-syndication.php
          php -l portal/webmention-service.php
          php -l portal/websub-service.php
          php -l portal/syndication-admin.php
          php -l portal/admin.php
          php -l portal/bootstrap.php
          php -l portal/blog-feed-output.php
          php -l blog.php
          php -l blog-post.php
          php -l blog-json-feed.php
          php -l podcast-feed.php
          php -l webmention.php
          php -l blog-feeds.php
          php -l cron/process-syndication.php
          grep -F "'syndication' => 'Syndication'" portal/bootstrap.php >/dev/null
          grep -F "syndication_render_admin" portal/admin.php >/dev/null
          grep -F "syndication_discovery_links" blog.php >/dev/null
          grep -F "application/feed+json" portal/public-syndication.php >/dev/null
          grep -F "CREATE TABLE IF NOT EXISTS syndication_webmentions" database/north_mountain_portal.sql >/dev/null
      - name: Commit integrated application source
        run: |
          set -euo pipefail
          rm -f tools/apply-public-syndication-v66e.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/admin.php portal/bootstrap.php portal/publishing-admin.php portal/blog-feed-output.php blog.php blog-post.php database/north_mountain_portal.sql tools/apply-public-syndication-v66e.py
          git commit -m "Integrate Public Syndication v66E"
          git push origin HEAD:${{ github.head_ref }}
