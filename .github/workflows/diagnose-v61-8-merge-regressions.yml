name: Diagnose v61.8 Merge Regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/visual-layout-system-v61-8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          : > v618-merge-regressions.log
          status=0
          for test in \
            tests/landing-page-builder-v61-2.php \
            tests/landing-page-editor-toggle.php \
            tests/landing-page-editor-v61-4.php \
            tests/landing-page-editor-v61-5.php \
            tests/landing-page-editor-v61-8.php
          do
            echo "=== $test ===" >> v618-merge-regressions.log
            php "$test" >> v618-merge-regressions.log 2>&1
            code=$?
            echo "exit=$code" >> v618-merge-regressions.log
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v61-8-merge-regression-diagnostic
          path: v618-merge-regressions.log
      - name: Require passing tests
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
