name: Harden ActivityPub Federation v66F

on:
  pull_request:
    branches: [main]
    paths:
      - tools/harden-activitypub-v66f.py
      - .github/workflows/harden-activitypub-v66f.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feature/activitypub-federation-v66f-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply security and lifecycle hardening
        run: python3 tools/harden-activitypub-v66f.py
      - name: Validate hardened source
        run: |
          set -euo pipefail
          php -l portal/activitypub.php
          php -l portal/activitypub-http.php
          php -l portal/activitypub-service.php
          php -l portal/activitypub-admin.php
          php -l portal/publishing-admin.php
          php -l cron/process-activitypub.php
          grep -F "#main-key-' . substr(hash('sha256', \$publicKey), 0, 16)" portal/activitypub.php >/dev/null
          grep -F 'activitypub_digest_matches' portal/activitypub-http.php >/dev/null
          grep -F 'activitypub_remote_actor($actorUri, false)' portal/activitypub-http.php >/dev/null
          grep -F '$matchesStoredFollow' portal/activitypub-service.php >/dev/null
          grep -F 'NOT EXISTS (' portal/activitypub-service.php >/dev/null
          grep -F '$backfilled = activitypub_backfill_published_posts' cron/process-activitypub.php >/dev/null
          ! grep -F '<img src="<?=e($follower[' portal/activitypub-admin.php
      - name: Commit hardened source
        run: |
          set -euo pipefail
          rm -f tools/harden-activitypub-v66f.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/activitypub.php portal/activitypub-http.php portal/activitypub-service.php portal/activitypub-admin.php portal/publishing-admin.php cron/process-activitypub.php tools/harden-activitypub-v66f.py
          git commit -m "Harden ActivityPub federation security and lifecycle v66F"
          git push origin HEAD:${{ github.head_ref }}
