name: Federated Interactions Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/federated-interactions-quality.yml'
      - 'portal/federated-interactions.php'
      - 'portal/federated-interactions-admin.php'
      - 'portal/activitypub-service.php'
      - 'portal/activitypub-admin.php'
      - 'portal/content-interactions.php'
      - 'portal/unified-inbox.php'
      - 'activitypub-comment.php'
      - 'assets/css/federated-interactions.css'
      - 'assets/css/activitypub-admin.css'
      - 'assets/css/content-interactions.css'
      - 'database/federated_interactions_v66g.sql'
      - 'database/north_mountain_portal.sql'
      - 'tests/federated-interactions-v66g.php'
      - 'tests/federated-interactions-db-v66g.php'
      - 'V66G-SCORECARD.md'
      - 'V66G-VALIDATION.txt'
      - 'FEDERATED-INTERACTIONS-SETUP-v66G.md'

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in \
            portal/federated-interactions.php \
            portal/federated-interactions-admin.php \
            portal/activitypub-service.php portal/activitypub-admin.php \
            portal/content-interactions.php portal/unified-inbox.php \
            activitypub-comment.php tests/federated-interactions-v66g.php \
            tests/federated-interactions-db-v66g.php; do
              php -l "$file"
          done
      - name: Source, moderation, and security regression
        run: php tests/federated-interactions-v66g.php
      - name: Schema and cleanup contract
        run: |
          set -euo pipefail
          for table in \
            activitypub_remote_comments activitypub_remote_reactions \
            activitypub_following activitypub_actor_controls \
            activitypub_domain_blocks activitypub_local_objects; do
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/federated_interactions_v66g.sql)" = "1"
              test "$(grep -c "CREATE TABLE IF NOT EXISTS ${table}" database/north_mountain_portal.sql)" = "1"
          done
          test ! -e tools/apply-federated-interactions-v66g.py
          test ! -e .github/workflows/apply-federated-interactions-v66g.yml
          grep -F "federated_interactions_process_inbound" portal/activitypub-service.php >/dev/null
          grep -F "federated_interactions_local_comment_event" portal/content-interactions.php >/dev/null
          grep -F "federated_interactions_following_document" portal/activitypub-service.php >/dev/null

  mysql-8-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nmm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP database extensions
        run: sudo apt-get update && sudo apt-get install -y php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nmm < database/north_mountain_portal.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/federated_interactions_v66g.sql
          mysql -h 127.0.0.1 -uroot -proot nmm < database/federated_interactions_v66g.sql
      - name: Live Federated Interactions database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/federated-interactions-db-v66g.php

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nmm
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client and PHP extensions
        run: sudo apt-get update && sudo apt-get install -y mariadb-client php-mysql php-mbstring
      - name: Import fresh schema and repeat-safe additive migration
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/north_mountain_portal.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/federated_interactions_v66g.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot nmm < database/federated_interactions_v66g.sql
      - name: Live Federated Interactions database integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: nmm
          DB_USER: root
          DB_PASS: root
        run: php tests/federated-interactions-db-v66g.php
