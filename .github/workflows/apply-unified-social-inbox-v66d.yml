name: Apply Unified Social Inbox v66D

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-unified-social-inbox-v66d.py
      - .github/workflows/apply-unified-social-inbox-v66d.yml

permissions:
  contents: write

concurrency:
  group: unified-social-inbox-v66d
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/unified-social-inbox-v66d-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic integration
        run: python3 tools/apply-unified-social-inbox-v66d.py
      - name: Focused validation
        run: |
          set -euo pipefail
          php -l portal/unified-inbox.php
          php -l portal/homeserver-adapter.php
          php -l portal/admin.php
          php -l portal/bootstrap.php
          node --check assets/js/unified-inbox.js
          node --check tests/unified-social-inbox-v66d.js
          grep -F "'inbox' => 'Unified Inbox'" portal/bootstrap.php >/dev/null
          grep -F "unified_inbox_render" portal/admin.php >/dev/null
          grep -F "CREATE TABLE IF NOT EXISTS unified_inbox_workflow" database/north_mountain_portal.sql >/dev/null
      - name: Commit integrated application source
        run: |
          set -euo pipefail
          rm -f tools/apply-unified-social-inbox-v66d.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/admin.php portal/bootstrap.php database/north_mountain_portal.sql tools/apply-unified-social-inbox-v66d.py
          git commit -m "Integrate Unified Social Inbox v66D"
          git push origin HEAD:${{ github.head_ref }}
