name: North Mountain Media Portal Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portal-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -print0)

      - name: CSS structure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

      - name: Portal regressions
        run: |
          set -euo pipefail
          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php
          php tests/landing-page-editor-v61-4.php
          php tests/landing-page-editor-v61-5.php
          php tests/landing-page-editor-v61-8.php
          php tests/site-analytics-listening-v61-9.php
          php tests/rss-feed-reader-v62.php
          php tests/social-feed-reader-v62-2.php
          php tests/public-sidebar-rss-v62-2-1.php
          php tests/pod-identity-relationships-v63.php
          php tests/pod-connected-calling-v63-1.php

      - name: Required source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.php
          test -f portal/site-builder.php
          test -f portal/site-builder-core.php
          test -f portal/site-builder-api.php
          test -f portal/public-sidebar.php
          test -f assets/js/site-builder.js
          test -f assets/css/site-builder-admin.css
          test -f assets/css/site-builder-public.css
          test -f assets/css/public-sidebar-v62-2-1.css
          test -f database/visual_site_builder_v61.sql
          test -f LANDING-PAGE-BUILDER-SETUP-v61.4.md
          test -f V61.4-VALIDATION.txt
          test -f LANDING-PAGE-BUILDER-SETUP-v61.5.md
          test -f V61.5-VALIDATION.txt
          test -f blog-feed.php
          test -f blog-atom.php
          test -f portal/blog-feed-output.php
          test -f portal/feed-reader-core.php
          test -f portal/feed-reader-view.php
          test -f portal/feed-reader-api.php
          test -f portal/feed-reader-opml.php
          test -f cron/feed-refresh.php
          test -f assets/js/feed-reader.js
          test -f assets/css/feed-reader.css
          test -f assets/js/feed-reader-social.js
          test -f assets/css/feed-reader-social.css
          test -f database/rss_feed_reader_v62.sql
          test -f RSS-FEED-READER-SETUP-v62.md
          test -f V62-SCORECARD.md
          test -f V62-VALIDATION.txt
          test -f tests/fixtures/rss-v62.xml
          test -f tests/fixtures/atom-v62.xml
          test -f tests/social-feed-reader-v62-2.php
          test -f tests/public-sidebar-rss-v62-2-1.php
          test -f database/pod_identity_relationships_v63.sql
          test -f portal/pod-identity.php
          test -f portal/pod-connections.php
          test -f pod-discovery.php
          test -f tests/pod-identity-relationships-v63.php
          test -f POD-IDENTITY-RELATIONSHIPS-SETUP-v63.md
          test -f V63-SCORECARD.md
          test -f V63-VALIDATION.txt
          test -f database/pod_connected_calling_v63_1.sql
          test -f portal/pod-connected-calling.php
          test -f portal/pod-contacts.php
          test -f portal/pod-contacts-v63-1.php
          test -f portal/pod-call-launch.php
          test -f pod-call.php
          test -f connected-call.php
          test -f assets/css/pod-connected-call-v63-1.css
          test -f assets/js/pod-contacts-v63-1.js
          test -f tests/pod-connected-calling-v63-1.php
          test -f POD-CONNECTED-CALLING-SETUP-v63.1.md
          test -f V63.1-SCORECARD.md
          test -f V63.1-VALIDATION.txt

      - name: Repository safety
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config.php
          test ! -d .nmm-v614
          test ! -d .nmm-v615
          test ! -f .github/workflows/apply-v61-4-builder.yml
          test ! -f .github/workflows/apply-v61-5-builder.yml
          test ! -f .github/workflows/export-rss-v62-source.yml
          test ! -f .github/workflows/apply-rss-v62.yml
          test ! -f .github/workflows/diagnose-rss-v62-payload.yml
          test ! -f .github/workflows/repair-rss-v62-payload.yml
          if find tools -maxdepth 1 -type f -name 'v62.patch.b64.part*' -print 2>/dev/null | grep -q .; then
            echo 'Temporary v62 payload files remain.' >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.lock' \) -print | grep -q .; then
            echo 'Unsafe configuration or runtime file found.' >&2
            exit 1
          fi
          if grep -RIlE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk_live_|ghp_|github_pat_|AKIA[0-9A-Z]{16}' . --exclude-dir=.git --exclude='portal-quality.yml' >/tmp/nmm-secret-files.txt; then
            echo 'Credential-like content detected.' >&2
            cat /tmp/nmm-secret-files.txt
            exit 1
          fi
