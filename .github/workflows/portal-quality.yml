name: North Mountain Media Portal Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portal-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -print0)

      - name: CSS structure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

      - name: Landing page builder regression
        run: |
          set -euo pipefail
          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php
          php tests/landing-page-editor-v61-4.php
          php tests/landing-page-editor-v61-5.php

      - name: Required builder source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.php
          test -f portal/site-builder.php
          test -f portal/site-builder-core.php
          test -f portal/site-builder-api.php
          test -f assets/js/site-builder.js
          test -f assets/css/site-builder-admin.css
          test -f assets/css/site-builder-public.css
          test -f database/visual_site_builder_v61.sql
          test -f LANDING-PAGE-BUILDER-SETUP-v61.4.md
          test -f V61.4-VALIDATION.txt
          test -f LANDING-PAGE-BUILDER-SETUP-v61.5.md
          test -f V61.5-VALIDATION.txt

      - name: Repository safety
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config.php
          test ! -d .nmm-v614
          test ! -d .nmm-v615
          test ! -f .github/workflows/apply-v61-4-builder.yml
          test ! -f .github/workflows/apply-v61-5-builder.yml
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.lock' \) -print | grep -q .; then
            echo 'Unsafe configuration or runtime file found.' >&2
            exit 1
          fi
          if grep -RIlE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk_live_|ghp_|github_pat_|AKIA[0-9A-Z]{16}' . --exclude-dir=.git --exclude='portal-quality.yml' >/tmp/nmm-secret-files.txt; then
            echo 'Credential-like content detected.' >&2
            cat /tmp/nmm-secret-files.txt
            exit 1
          fi
