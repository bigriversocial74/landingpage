name: Build Publishing Center v66Q

on:
  push:
    branches:
      - feature/publishing-center-agent-chat-v66q-20260731

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Build centralized publishing and agent workspace v66Q'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v66Q implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # Module catalog.
          path = 'portal/site-settings.php'
          text = read(path)
          old = """        'landing_page' => ['label' => 'Landing Page', 'description' => 'Use the selected landing-page template as the public home page.', 'default' => false],
        'portfolio' => ['label' => 'Portfolio', 'description' => 'Show portfolio projects, case studies, and portfolio navigation.', 'default' => true],"""
          new = """        'landing_page' => ['label' => 'Landing Page', 'description' => 'Use the selected landing-page template as the public home page.', 'default' => false],
        'clients' => ['label' => 'Clients', 'description' => 'Enable client accounts, client projects, protected files, and client navigation.', 'default' => true],
        'leads' => ['label' => 'Leads', 'description' => 'Enable lead records, inquiry archives, and lead navigation.', 'default' => true],
        'portfolio' => ['label' => 'Portfolio', 'description' => 'Show portfolio projects, case studies, and portfolio navigation.', 'default' => true],"""
          text = replace_once(text, old, new, 'module definitions clients/leads')
          old = """        'blog' => ['label' => 'Blog', 'description' => 'Show the public blog archive and published posts.', 'default' => true],
        'feed_reader' => ['label' => 'Feed Reader', 'description' => 'Allow authenticated users to subscribe to and read external RSS and Atom feeds.', 'default' => true],"""
          new = """        'blog' => ['label' => 'Blog', 'description' => 'Show the public blog archive and published posts.', 'default' => true],
        'rss' => ['label' => 'RSS & Syndication', 'description' => 'Enable RSS, Atom, JSON Feed, podcast feeds, WebSub, and feed-discovery navigation.', 'default' => true],
        'social_feed' => ['label' => 'Social Feed', 'description' => 'Enable permanent social posts, the public POD feed, and administrator Social Feed navigation.', 'default' => true],
        'stories' => ['label' => 'Stories', 'description' => 'Enable temporary follower Stories and Story publishing options.', 'default' => true],
        'feed_reader' => ['label' => 'Feed Reader', 'description' => 'Allow authenticated users to subscribe to and read external RSS and Atom feeds.', 'default' => true],"""
          text = replace_once(text, old, new, 'module definitions rss/social')
          write(path, text)

          # Public sidebar module controls.
          path = 'portal/public-sidebar.php'
          text = read(path)
          text = replace_once(
              text,
              "$rssEnabled = $moduleEnabled('blog')\n        && (",
              "$rssEnabled = $moduleEnabled('blog')\n        && $moduleEnabled('rss')\n        && (",
              'rss module condition'
          )
          old = """<?php if($moduleEnabled('blog')):?>
<a href="<?=nmm_public_sidebar_escape(nmm_public_sidebar_url('blog.php'))?>"><span>Blog</span></a>
<?php endif;?>"""
          new = """<?php if($moduleEnabled('blog')):?>
<a href="<?=nmm_public_sidebar_escape(nmm_public_sidebar_url('blog.php'))?>"><span>Blog</span></a>
<?php endif;?>
<?php if($moduleEnabled('social_feed')):?>
<a href="<?=nmm_public_sidebar_escape(nmm_public_sidebar_url('social-feed.php'))?>"><span>Social Feed</span></a>
<?php endif;?>"""
          text = replace_once(text, old, new, 'public social feed link')
          write(path, text)

