name: Apply Music Library mobile links

on:
  push:
    branches:
      - fix/music-library-mobile-player-v66n-20260731
    paths:
      - 'tools/apply-music-mobile-v66n.py'
      - '.github/workflows/apply-music-mobile-v66n.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/music-library-mobile-player-v66n-20260731
      - run: python3 tools/apply-music-mobile-v66n.py
      - run: |
          set -euo pipefail
          php -l music-library.php
          php -l music-library-preview.php
          php -l music-collection.php
          php -l music-collection-preview.php
          php tests/music-library-mobile-v66n.php
      - name: Commit linked pages
        run: |
          set -euo pipefail
          if git diff --quiet -- music-library.php music-library-preview.php music-collection.php music-collection-preview.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-library.php music-library-preview.php music-collection.php music-collection-preview.php
          git commit -m 'Link Music Library mobile upgrade across public pages'
          git push origin HEAD:fix/music-library-mobile-player-v66n-20260731
