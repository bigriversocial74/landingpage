name: Repair ActivityPub Certification v66F

on:
  pull_request:
    branches: [main]
    paths:
      - tools/repair-activitypub-certification-v66f.py
      - .github/workflows/repair-activitypub-certification-v66f.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/activitypub-federation-v66f-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply certification repair
        run: python3 tools/repair-activitypub-certification-v66f.py
      - name: Remove one-use repair controller
        run: rm -f tools/repair-activitypub-certification-v66f.py .github/workflows/repair-activitypub-certification-v66f.yml
      - name: Validate protocol and fresh-schema repair
        run: |
          set -euo pipefail
          php -l portal/activitypub-http.php
          php -l tests/activitypub-v66f.php
          php tests/activitypub-v66f.php
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('database/north_mountain_portal.sql').read_text(encoding='utf-8')
          pod = schema.index('CREATE TABLE IF NOT EXISTS pod_identities (')
          activity = schema.index('CREATE TABLE IF NOT EXISTS activitypub_actor_keys (')
          if activity <= pod:
              raise SystemExit('ActivityPub fresh-schema block must follow POD identity tables')
          if schema.count('CREATE TABLE IF NOT EXISTS pod_identities (') != 1:
              raise SystemExit('pod_identities fresh-schema definition is not unique')
          for table in (
              'activitypub_actor_keys','activitypub_remote_actors',
              'activitypub_followers','activitypub_inbox_activities',
              'activitypub_outbox_activities','activitypub_deliveries',
          ):
              if schema.count('CREATE TABLE IF NOT EXISTS ' + table) != 1:
                  raise SystemExit(f'{table} fresh-schema definition is not unique')
          PY
          test ! -e tools/repair-activitypub-certification-v66f.py
          test ! -e .github/workflows/repair-activitypub-certification-v66f.yml
      - name: Commit certification repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portal/activitypub-http.php tests/activitypub-v66f.php database/north_mountain_portal.sql .github/workflows/activitypub-federation-quality.yml tools/repair-activitypub-certification-v66f.py .github/workflows/repair-activitypub-certification-v66f.yml
          git commit -m "Repair ActivityPub protocol parsing and fresh schema v66F"
          git push origin HEAD:${{ github.head_ref }}
