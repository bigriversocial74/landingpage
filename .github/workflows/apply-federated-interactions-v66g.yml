name: Apply Federated Interactions v66G

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-federated-interactions-v66g.yml'
      - 'tools/apply-federated-interactions-v66g.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/federated-interactions-social-graph-v66g-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic integration
        run: python3 tools/apply-federated-interactions-v66g.py
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in \
            portal/activitypub-service.php portal/activitypub-admin.php \
            portal/content-interactions.php portal/unified-inbox.php \
            portal/federated-interactions.php portal/federated-interactions-admin.php \
            activitypub-comment.php; do
              php -l "$file"
          done
      - name: Source contract
        run: |
          set -euo pipefail
          grep -F "federated_interactions_process_inbound" portal/activitypub-service.php >/dev/null
          grep -F "federated_interactions_local_comment_event" portal/content-interactions.php >/dev/null
          grep -F "federated_interactions_inbox_items" portal/unified-inbox.php >/dev/null
          grep -F "federated_interactions_render_admin" portal/activitypub-admin.php >/dev/null
          grep -F "activitypub_remote_comments" database/north_mountain_portal.sql >/dev/null
          grep -F "'Follow', 'Undo', 'Like', 'Announce'" portal/activitypub-service.php >/dev/null
      - name: Commit integrated application
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            portal/activitypub-service.php portal/activitypub-admin.php \
            portal/content-interactions.php portal/unified-inbox.php \
            portal/federated-interactions.php \
            assets/css/activitypub-admin.css assets/css/content-interactions.css \
            database/north_mountain_portal.sql
          git commit -m "Integrate Federated Interactions and Social Graph v66G"
          git push origin HEAD:${{ github.head_ref }}
