name: Portal Repair Quality

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'landing-page.php'
      - 'social-feed.php'
      - 'tests/portal-repair-v66q7.php'
      - 'tests/agent-chat-workspace-v66q4.php'
      - 'tests/federated-timeline-v66h.php'
      - 'tests/federated-messaging-v66i.php'
      - 'tests/stories-v66o.php'
      - '.github/workflows/publishing-center-quality.yml'

permissions:
  contents: read

jobs:
  source-quality:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax
        run: |
          find portal tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l landing-page.php
          php -l social-feed.php
      - name: JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: v66Q.7 portal repair contract
        run: php tests/portal-repair-v66q7.php
      - name: Retained Agent Chat workspace contract
        run: php tests/agent-chat-workspace-v66q4.php
      - name: Retained Federated Timeline contract
        run: php tests/federated-timeline-v66h.php
      - name: Retained Federated Messaging contract
        run: php tests/federated-messaging-v66i.php
      - name: Retained Stories contract
        run: php tests/stories-v66o.php
