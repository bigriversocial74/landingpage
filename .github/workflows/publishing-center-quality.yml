name: Portal Repair Quality

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'landing-page.php'
      - 'social-feed.php'
      - 'tests/**'
      - '.github/workflows/publishing-center-quality.yml'

permissions:
  contents: read

jobs:
  source-quality:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax
        run: |
          find portal tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l landing-page.php
          php -l social-feed.php
      - name: JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: v66Q.7 consolidated portal repair
        run: php tests/portal-repair-v66q7.php
      - name: v66Q retained Publishing Center
        run: php tests/publishing-center-v66q.php
      - name: v66Q.1 retained Publishing, Agent Chat, and My Feed
        run: php tests/publishing-agent-repair-v66q1.php
      - name: v66Q.2 retained Publishing and Agent runtime
        run: php tests/publishing-agent-runtime-v66q2.php
      - name: v66Q.3 retained unified portal runtime
        run: php tests/portal-unified-runtime-v66q3.php
      - name: Retained Agent Chat workspace
        run: php tests/agent-chat-workspace-v66q4.php
      - name: v66Q.5 retained dashboard, navigation, and Publishing
        run: php tests/dashboard-publishing-navigation-v66q5.php
      - name: v66Q.6 retained shell, My Feed, Publishing, and user menu
        run: php tests/portal-shell-user-menu-v66q6.php
      - name: Federated entry-point mocked execution
        run: php tests/federated-entrypoints-v66q7.php
      - name: Retained Federated Timeline
        run: php tests/federated-timeline-v66h.php
      - name: Retained Federated Messaging
        run: php tests/federated-messaging-v66i.php
      - name: Retained Stories
        run: php tests/stories-v66o.php
      - name: Retained Social Posts
        run: php tests/social-posts-v66p.php
