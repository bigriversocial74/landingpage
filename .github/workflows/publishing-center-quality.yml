name: Publishing Center Quality

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'social-feed.php'
      - 'blog-feed.php'
      - 'blog-atom.php'
      - 'blog-json-feed.php'
      - 'blog-feeds.php'
      - 'podcast-feed.php'
      - 'tests/publishing-center-v66q.php'
      - 'tests/publishing-agent-repair-v66q1.php'
      - 'tests/publishing-agent-runtime-v66q2.php'
      - 'tests/portal-unified-runtime-v66q3.php'
      - 'tests/agent-chat-workspace-v66q4.php'
      - 'tests/dashboard-publishing-navigation-v66q5.php'
      - 'tests/portal-shell-user-menu-v66q6.php'
      - 'tests/social-posts-v66p.php'
      - '.github/workflows/publishing-center-quality.yml'

permissions:
  contents: read

jobs:
  source-quality:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: PHP syntax
        run: |
          find portal -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l social-feed.php
          php -l blog-feed.php
          php -l blog-atom.php
          php -l blog-json-feed.php
          php -l blog-feeds.php
          php -l podcast-feed.php
          php -l tests/publishing-agent-runtime-v66q2.php
          php -l tests/portal-unified-runtime-v66q3.php
          php -l tests/agent-chat-workspace-v66q4.php
          php -l tests/dashboard-publishing-navigation-v66q5.php
          php -l tests/portal-shell-user-menu-v66q6.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/portal.js
          node --check assets/js/publishing-center-v66q.js
          node --check assets/js/publishing-complete-v66q.js
          node --check assets/js/publishing-agent-runtime-v66q2.js
          node --check assets/js/portal-unified-runtime-v66q3.js
          node --check assets/js/portal-agent-chat-v66q4.js
          node --check assets/js/portal-dashboard-publishing-v66q5.js
          node --check assets/js/portal-shell-v66q6.js
          node --check assets/js/public-user-menu-v66q6.js
          node --check assets/js/landing-page.js
          node --check assets/js/site-public.js
      - name: Publishing Center contract
        run: php tests/publishing-center-v66q.php
      - name: Publishing, Agent Chat, and My Feed repair contract
        run: php tests/publishing-agent-repair-v66q1.php
      - name: Publishing and Agent runtime contract
        run: php tests/publishing-agent-runtime-v66q2.php
      - name: Unified portal runtime contract
        run: php tests/portal-unified-runtime-v66q3.php
      - name: Agent Chat workspace contract
        run: php tests/agent-chat-workspace-v66q4.php
      - name: Dashboard, navigation, and Publishing contract
        run: php tests/dashboard-publishing-navigation-v66q5.php
      - name: Portal shell and user-menu contract
        run: php tests/portal-shell-user-menu-v66q6.php
      - name: Retained Social Posts contract
        run: php tests/social-posts-v66p.php
