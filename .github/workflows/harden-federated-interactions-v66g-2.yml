name: Harden Federated Interactions Policy v66G

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harden-federated-interactions-v66g-2.yml'
      - 'tools/harden-federated-interactions-v66g-2.py'

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feature/federated-interactions-social-graph-v66g-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply policy and reliability hardening
        run: |
          set -euo pipefail
          python3 tools/harden-federated-interactions-v66g-2.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/federated-interactions-v66g.php')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              "federated_interactions_local_comment_event($commentId, \\'Create\\'",
              "federated_interactions_safe_comment_event($commentId, \\'Create\\'",
          ).replace(
              "federated_interactions_local_comment_event($commentId, \\'Update\\'",
              "federated_interactions_safe_comment_event($commentId, \\'Update\\'",
          ).replace(
              "federated_interactions_local_comment_event($commentId, \\'Delete\\'",
              "federated_interactions_safe_comment_event($commentId, \\'Delete\\'",
          )
          path.write_text(content, encoding='utf-8')
          PY
      - name: Validate hardening
        run: |
          set -euo pipefail
          php -l portal/federated-interactions.php
          php -l portal/content-interactions.php
          php -l tests/federated-interactions-v66g.php
          php -l tests/federated-interactions-db-v66g.php
          php tests/federated-interactions-v66g.php
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            portal/federated-interactions.php portal/content-interactions.php \
            tests/federated-interactions-v66g.php tests/federated-interactions-db-v66g.php
          git commit -m "Harden Federated Interactions ownership and policy v66G"
          git push origin HEAD:${{ github.head_ref }}
