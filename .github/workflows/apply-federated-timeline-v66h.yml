name: Apply Federated Timeline v66H

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-federated-timeline-v66h.yml'
      - 'tools/apply-federated-timeline-v66h.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/federated-timeline-discovery-v66h-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-federated-timeline-v66h.py')
          content = path.read_text(encoding='utf-8')
          replacements = {
              '"] : [];\\n$actors = $schemaAvailable': '"], 150) : [];\\n$actors = $schemaAvailable',
              '"] : [];\\n$actionsByPost = $schemaAvailable': '"], 150) : [];\\n$actionsByPost = $schemaAvailable',
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f'Page query patch anchor count for {old}: {content.count(old)}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
          python3 tools/apply-federated-timeline-v66h.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('portal/federated-feed.php')
          content = path.read_text(encoding='utf-8')
          replacements = {
              "empty($post['read_at'])?'read':'unread'=>empty($post['read_at'])?'Mark read':'Mark unread',": "(empty($post['read_at'])?'read':'unread')=>(empty($post['read_at'])?'Mark read':'Mark unread'),",
              "empty($post['saved_at'])?'save':'unsave'=>empty($post['saved_at'])?'Save':'Unsave',": "(empty($post['saved_at'])?'save':'unsave')=>(empty($post['saved_at'])?'Save':'Unsave'),",
              "empty($post['hidden_at'])?'hide':'unhide'=>empty($post['hidden_at'])?'Hide':'Unhide',": "(empty($post['hidden_at'])?'hide':'unhide')=>(empty($post['hidden_at'])?'Hide':'Unhide'),",
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f'State-action syntax anchor count for {old}: {content.count(old)}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in \
            portal/federated-timeline.php portal/federated-feed.php \
            portal/activitypub-http.php portal/activitypub-service.php \
            portal/federated-interactions.php portal/unified-inbox.php \
            portal/activitypub-admin.php activitypub-timeline-reply.php \
            cron/process-activitypub.php; do
              php -l "$file"
          done
      - name: Source and privacy contract
        run: |
          set -euo pipefail
          grep -F 'application/jrd+json' portal/activitypub-http.php >/dev/null
          grep -F 'federated_timeline_process_inbound' portal/activitypub-service.php >/dev/null
          grep -F 'federated_timeline_sync_delivery' portal/activitypub-service.php >/dev/null
          grep -F 'federated_timeline_actions_for_posts' portal/federated-feed.php >/dev/null
          grep -F 'remote_media_mode' portal/federated-timeline.php >/dev/null
          grep -F 'federated_timeline_inbox_items' portal/unified-inbox.php >/dev/null
          grep -F 'activitypub_remote_posts' database/north_mountain_portal.sql >/dev/null
          if grep -F '<img' portal/federated-feed.php; then exit 1; fi
          if grep -F '<audio' portal/federated-feed.php; then exit 1; fi
          if grep -F '<video' portal/federated-feed.php; then exit 1; fi
      - name: Commit integrated application
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            portal/federated-timeline.php portal/federated-feed.php \
            portal/activitypub-http.php portal/activitypub-service.php \
            portal/federated-interactions.php portal/unified-inbox.php \
            portal/activitypub-admin.php cron/process-activitypub.php \
            database/north_mountain_portal.sql
          git commit -m "Integrate Federated Timeline and Discovery v66H"
          git push origin HEAD:${{ github.head_ref }}
