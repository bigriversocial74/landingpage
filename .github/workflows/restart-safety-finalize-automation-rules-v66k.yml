name: Restart Safety Finalize Automation Rules v66K

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/restart-safety-finalize-automation-rules-v66k.yml'
      - 'tools/restart-safety-finalize-automation-rules-v66k.py'

permissions:
  contents: write

jobs:
  restart-safety:
    if: github.head_ref == 'feature/automation-routing-action-center-v66k-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply complete restart-safe finalization
        run: |
          set -euo pipefail
          python3 tools/restart-safety-finalize-automation-rules-v66k.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mbstring
      - name: Validate restart-safe source
        run: |
          set -euo pipefail
          for file in \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            cron/process-automation.php \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php; do
              php -l "$file"
          done
          node --check assets/js/automation-center.js
          grep -F 'automation_recover_interrupted_approvals' portal/automation-rules.php >/dev/null
          grep -F 'WHERE id=:id AND status="approved"' portal/automation-rules.php >/dev/null
          grep -F 'Interrupted approved requests must be recovered exactly once.' tests/automation-rules-db-v66k.php >/dev/null
          grep -F 'ON DELETE SET NULL' database/automation_rules_v66k.sql >/dev/null
          ! grep -F 'DELETE FROM automation_rules' portal/automation-admin.php
      - name: Commit restart-safe application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            portal/automation-rules.php \
            portal/automation-admin.php \
            portal/admin.php \
            portal/notifications.php \
            portal/bootstrap.php \
            database/automation_rules_v66k.sql \
            database/north_mountain_portal.sql \
            tests/automation-rules-v66k.php \
            tests/automation-rules-db-v66k.php
          git commit -m 'Make Automation Rules v66K restart-safe'
          git push origin HEAD:${{ github.head_ref }}
