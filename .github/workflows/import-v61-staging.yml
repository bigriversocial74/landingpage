name: Import North Mountain Media Portal v61 Source

on:
  push:
    branches:
      - import/north-mountain-media-portal-v61-staging
    paths:
      - .github/workflows/import-v61-staging.yml

permissions:
  contents: write

concurrency:
  group: nmm-v61-source-import-staging
  cancel-in-progress: false

jobs:
  unpack-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: import/north-mountain-media-portal-v61-staging
          fetch-depth: 0

      - name: Verify archive exists
        run: test -f north-mountain-media-portal-v61.zip

      - name: Extract and sanitize source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .nmm-import
          mkdir -p .nmm-import
          unzip -q north-mountain-media-portal-v61.zip -d .nmm-import

          SOURCE_DIR=".nmm-import/nmm_v61_build"
          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="$(find .nmm-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/index.php" ] || [ ! -d "$SOURCE_DIR/portal" ]; then
            echo "The archive does not contain the expected North Mountain Media Portal source." >&2
            exit 1
          fi

          if find "$SOURCE_DIR" -type f \( -name config.php -o -name .env -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.lock' \) | grep -q .; then
            echo "Unsafe production or runtime files were found in the archive." >&2
            find "$SOURCE_DIR" -type f \( -name config.php -o -name .env -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.log' -o -name '*.lock' \)
            exit 1
          fi

          if grep -RIlE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk_live_|ghp_|github_pat_|AKIA[0-9A-Z]{16}' "$SOURCE_DIR" >/tmp/nmm-secret-files.txt; then
            echo "A credential-like value was detected." >&2
            cat /tmp/nmm-secret-files.txt
            exit 1
          fi

          rsync -a "$SOURCE_DIR"/ ./ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='config.php'

          if [ -d storage ]; then
            find storage -type f \
              ! -name '.gitkeep' \
              ! -name '.htaccess' \
              ! -name 'index.php' \
              -delete
          fi

          rm -f north-mountain-media-portal-v61.zip
          rm -rf .nmm-import

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -print0)

      - name: Confirm required v61 files
        shell: bash
        run: |
          set -euo pipefail
          test -f portal/site-builder.php
          test -f portal/menus-admin.php
          test -f portal/site-analytics-view.php
          test -f portal/microgifter-connectors.php
          test -f assets/js/menu-manager.js
          test -f database/visual_site_builder_v61.sql
          test -f VISUAL-SITE-BUILDER-SETUP-v61.md

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import North Mountain Media Portal v61 source'
          git push origin HEAD:import/north-mountain-media-portal-v61-staging
