name: Apply v61.3 Landing Editor Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-editor-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/default-landing-template-modal-editor-v61-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-landing-template-modal-editor-v61-3
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct, validate, and commit v61.3
        shell: bash
        run: |
          set -euo pipefail

          cat .nmm-v613/chunk-*.txt | base64 -d > /tmp/nmm-v613-fix.tgz
          echo 'c708a949902c0f541f2326bfc4efac5f18e947689606a2bd3847fced4b78242e  /tmp/nmm-v613-fix.tgz' | sha256sum -c -
          tar -xzf /tmp/nmm-v613-fix.tgz

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          echo 'PHP syntax passed.'

          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo 'JavaScript syntax passed.'

          php tests/landing-page-builder-v61-2.php
          php tests/landing-page-editor-toggle.php

          python3 <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              escaped = False
              comment = False
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if comment:
                      if char == '*' and nxt == '/':
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue
                  if char == '/' and nxt == '*':
                      comment = True
                      index += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces in {path}')
                  index += 1
              if depth != 0 or quote or comment:
                  raise SystemExit(f'Unbalanced CSS structure in {path}')
          print('CSS structure passed.')
          PY

          grep -q '20260727-landing-page-builder-v61.3' portal/site-builder.php
          grep -q 'ensureDefaultLandingCanvas' assets/js/site-builder.js
          grep -q 'data-editor-modal-panel="landing"' portal/site-builder.php
          grep -q 'site-library-modal' assets/css/site-builder-admin.css

          rm -rf .nmm-v613
          rm -f .github/workflows/apply-v61-3-editor-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix default landing template and modal editor v61.3'
          git push origin HEAD:fix/default-landing-template-modal-editor-v61-3
